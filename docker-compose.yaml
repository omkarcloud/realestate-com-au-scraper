services:
  realestate-com-au-scraper:
    build: .
    restart: unless-stopped
    shm_size: "1gb"
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Optional at home; on a cloud server use a residential proxy (Australian works best).
      # - REALESTATE_COM_AU_PROXY=http://user:pass@host:port

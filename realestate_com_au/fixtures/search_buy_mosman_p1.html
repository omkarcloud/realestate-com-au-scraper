\"description\\\":\\\"Opportunities of this scale have only presented themselves a handful of times across the Lower North Shore in the past decade. Set on 2,668sqm with expansive harbour views and a landmark c1903 residence, this is a true estate - the kind of landholding, position and scale that simply cannot be recreated.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EPositioned at the quiet southern end of Buena Vista Avenue, the home is deliberately oriented towards the harbour rather than the street, capturing sweeping 180-degree panoramas across Taylors Bay towards Rose Bay, Shark Island and the ocean horizon.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EEstablished bushland borders the southern boundary, creating a green and uninterrupted outlook, while the northerly aspect draws sunlight across the lawns, gardens and terraces throughout the day. The sense of privacy is exceptional, with the scale of the block allowing the residence to sit comfortably within its surrounds rather than dominate them.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EInside, the proportions are generous and beautifully suited to family living. Formal living and dining rooms sit either side of a wide central foyer, while an expansive 10-metre family room and stone-finished Miele kitchen open seamlessly to the sweeping curved terrace, pool and gardens beyond.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ESix bedrooms are arranged across two levels, including a substantial main suite with its own harbour-view balcony. A ground-floor bedroom provides flexibility for guests, extended family or multi-generational living.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThe lower level adds another layer to the home's entertaining credentials, with a wine cellar and pool cabana, while the upper balconies capture the harbour from multiple aspects.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EBeyond the gates, a sweeping driveway reinforces the sense of arrival, leading to a double lock-up garage with additional off-street parking for three vehicles.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EA genuine Lower North Shore estate of extraordinary rarity - combining a landmark residence, 2,668sqm of land and expansive harbour views in one of Mosman's most tightly held settings.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E• Level 2,668sqm north-facing landholding in one of Mosman's most tightly held pockets\u003Cbr\u002F\u003E• Expansive 180-degree harbour panoramas across Taylors Bay towards Rose Bay, Shark Island and the ocean horizon\u003Cbr\u002F\u003E• Landmark c1903 residence positioned to maximise the harbour outlook\u003Cbr\u002F\u003E• Established bushland along the southern boundary providing privacy and an uninterrupted green outlook\u003Cbr\u002F\u003E• Six bedrooms across two levels, including a main suite with private harbour-view balcony\u003Cbr\u002F\u003E• Formal living and dining rooms plus an expansive 10-metre family room\u003Cbr\u002F\u003E• Stone-finished kitchen with Miele appliances opening directly to the terrace\u003Cbr\u002F\u003E• Sweeping curved entertainer's terrace overlooking the pool, lawns and harbour\u003Cbr\u002F\u003E• Wine cellar and pool cabana on the lower-ground level\u003Cbr\u002F\u003E• Sandstone foundations, soaring ceilings and ducted air conditioning\u003Cbr\u002F\u003E• Double lock-up garage plus off-street parking for a further three vehicles\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EArtist’s impressions and concept plans have been prepared by Hampton Architecture for illustrative purposes only. They are not approved plans and do not form part of the sale. Any future development is subject to council and other approvals, which may not be granted, and the final design may differ. Interested parties should obtain their own planning advice.\u003Cbr\u002F\u003E\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fef6ac56c34bf97050b475edb963a58651da0e12cd19c7af3d274e290d380d8cb\u002Fimage.jpg\\\",\\\"__ty ing waterways.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThe entry level offers a choice of formal and informal living spaces, with the open-plan rear of the home extending seamlessly to a generous alfresco entertaining terrace framed by established gardens and a tranquil pond. Upstairs, the flexible accommodation includes four bedrooms, with additional spaces easily adapted as a study, music room, nursery or dedicated home office. Adding further versatility is a self-contained garden apartment with its own private entrance, ideal as a teenage retreat, guest or in-law accommodation, or a separate space for those working from home.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EPositioned within a tightly held pocket of Mosman, this sought-after location combines a welcoming community atmosphere with exceptional lifestyle convenience. Families will appreciate access to a highly regarded local primary school, harbourside parklands and playing fields, while nearby transport provides easy connections to the city, surrounding suburbs and the Northern Beaches. Just moments from The Spit, Middle Harbour Yacht Club and the vibrant villages of Mosman and Seaforth, it's an ideal setting to settle in, enjoy and grow.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E- Enviable harbourside Pearl Bay\u002FBeauty Point locale\u003Cbr\u002F\u003E- Positioned on the high side of a private cul-de-sac\u003Cbr\u002F\u003E- Established verdant front and terraced rear gardens\u003Cbr\u002F\u003E- Three levels of living with garage + 4 car o\u002Fs parking\u003Cbr\u002F\u003E- Entrance vestibule with elegant staircase to upper level\u003Cbr\u002F\u003E- Formal living area spills out to a patio with leafy outlook\u003Cbr\u002F\u003E- Timber floorboards, built-in bespoke joinery, gas fireplace\u003Cbr\u002F\u003E- The formal dining has an elegant 'bay-style' sitting nook \u003Cbr\u002F\u003E- Gas cooking kitchen with s\u002Fs Euro appliances & d\u002Fwasher\u003Cbr\u002F\u003E- Convenient breakfast bar and separate butlers pantry\u003Cbr\u002F\u003E- Separate internal laundry room with shower facility\u003Cbr\u002F\u003E- Large open plan informal living flows to alfresco patio\u003Cbr\u002F\u003E- Established rear garden, gas bbq area, tranquil fish pond\u003Cbr\u002F\u003E- All bedrooms appointed with built-in robes and ceiling fans\u003Cbr\u002F\u003E- Master bedroom opens to elegant balcony perfect for reading\u003Cbr\u002F\u003E- Flexible floor plan presents options for use incl. home office\u003Cbr\u002F\u003E- Family bathroom with separate f\u002Fsize tub and shower\u003Cbr\u002F\u003E- Separate w\u002Fc on both levels, abundant storage options\u003Cbr\u002F\u003E- Lockup garage plus off-street parking for four vehicles\u003Cbr\u002F\u003E- Walk to harbourside parklands and recreation facilities\u003Cbr\u002F\u003E- Catchment for highly desirable Beauty Point School\u003Cbr\u002F\u003E- Moments to local, north and city-bound bus connections \u003Cbr\u002F\u003E- Easy access to Mosman and Seaforth shopping villages\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EOPEN TIMES DISPLAYED ON WEBSITE : www.croll.com.au or to arrange a PRIVATE INSPECTION with the agent please contact ANDREW CROLL 0409 530 133.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EAll information contained herein is gathered from sources we believe to be reliable. However, we cannot guarantee its accuracy, and interested persons should rely on their own enquiries.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F967d8cc631c23868c8c5083781b633c5fa67f6ab0af0390c7c6b424b5a39b09d\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"images\\\":[{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F967d8cc631c23868c8c5083781b633c5fa67f6ab0af0390c7c6b424b5a39b09d\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F ily home of over 40 years, this is an unmissable opportunity to capitalise on the sheer size of the landholding and the rare direct access to the harbour. Very comfortable as is, explore endless possibilities to build your waterfront dream on the shores of Quakers Hat Bay, (subject to council approval). Complete with a tidal beach and tidal landing for boat pick up and drop off, discover Sydney's famous waterways at your leisure. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EPart of an exclusive lifestyle focused pocket, access both the Sydney CBD and Northern Beaches from the bus stop 800 metres away on Spit Road. Zoned for the highly sought-after Beauty Point Public School, this prized address is also 1.8km from Spit Junction, Mosman village and Bridgepoint Shopping Centre. Become captivated by the surrounding harbourside beauty with Spit Reserve just 1.5km away and enjoy a stroll along the waterfront foreshore, visit the off-leash dog park or explore Chinamans Beach (1.4km away) or Balmoral Beach (2.1km away).\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E•\\\\tWraparound terrace embraces entry and living level\u003Cbr\u002F\u003E•\\\\tLiving and dining outlined by three walls of glass\u003Cbr\u002F\u003E•\\\\tSliding glass doors open out to the timber deck\u003Cbr\u002F\u003E•\\\\tLined in skylights, clever design to enhance aspect\u003Cbr\u002F\u003E•\\\\tCladded ceiling and original mid-century joinery\u003Cbr\u002F\u003E•\\\\tAir-conditioning and ceiling fans in main living \u003Cbr\u002F\u003E•\\\\tUpdated kitchen, stone benchtops and splashbacks\u003Cbr\u002F\u003E•\\\\tWestinghouse double wall oven and microwave\u003Cbr\u002F\u003E•\\\\tDouble sink, filtered water tap and dishwasher\u003Cbr\u002F\u003E•\\\\tViews from the kitchen, versatile island bench\u003Cbr\u002F\u003E•\\\\tBuilt-in robes and dressing table in the master bed\u003Cbr\u002F\u003E•\\\\tMaster bedroom enjoying a relaxing garden outlook\u003Cbr\u002F\u003E•\\\\tModernised central bathroom, separate bathtub\u003Cbr\u002F\u003E•\\\\tHarbour views from 2nd bedroom with ensuite \u003Cbr\u002F\u003E•\\\\tVersatile layout with potential for 3rd bedroom\u003Cbr\u002F\u003E•\\\\tFamily room\u002F3rd bedroom opening to timber deck\u003Cbr\u002F\u003E•\\\\tRumpus\u002Fgames room with separate storage room\u003Cbr\u002F\u003E•\\\\tSauna and corner spa bath with double shower\u003Cbr\u002F\u003E•\\\\tLaundry with storage and direct outside access\u003Cbr\u002F\u003E•\\\\tSecure swimming pool, paved entertaining patios\u003Cbr\u002F\u003E•\\\\tPathway leads to harbour, landing and tidal beach\u003Cbr\u002F\u003E•\\\\tDouble carport at the end of a long driveway\u003Cbr\u002F\u003E•\\\\tStudio\u002Fworkshop\u002Fstorage space under carport\u003Cbr\u002F\u003E•\\\\t800m to Spit Road buses with routes to the CBD and Northern Beaches\u003Cbr\u002F\u003E•\\\\t1km to popular Beauty Point Public School \u003Cbr\u002F\u003E•\\\\t1.4km to Chinamans Beach, 2.1km to Balmoral Beach \u003Cbr\u002F\u003E•\\\\t1.8km to Bridgepoint Shops, Spit Junction and Mosman Village\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EAsk us about concept plans (leading local architects Studio Design Group), to create a circa 500sqm; internal world class waterfront residence.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E*All information contained herein is gathered from sources we consider to be reliable. However we cannot guarantee its accuracy and interested persons should rely on their own enquiries.  \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EFor more information or to arrange an inspection, please contact Sabrina Gao 0433 666 591 or Bernard Ryan 0408 408 509.\u003Cbr\u002F\u003E\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fc77578e601653d6ce730be3f4c8db632f0a2b89d838aa67cd505e5ac777a6c76\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"images\\\":[{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\ a-gao-3237456?cid={cid}\\\",\\\"__typename\\\":\\\"AbsoluteLinks\\\"},\\\"__typename\\\":\\\"ListerLinks\\\"},\\\"showInMediaViewer\\\":false,\\\"__typename\\\":\\\"Lister\\\"},{\\\"id\\\":\\\"1797578\\\",\\\"agentId\\\":\\\"ba9320eb-2eae-4fa1-b1c6-ae76e27706f0\\\",\\\"name\\\":\\\"Bernard Ryan\\\",\\\"jobTitle\\\":\\\"Director | Licensed Real Estate Agent\\\",\\\"photo\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fb03e6aa6a13681b79c4eac51f94561a1a81859d575e542ad4139639ae197d5cb\u002Fmain.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"_links\\\":{\\\"canonical\\\":{\\\"href\\\":\\\"https:\u002F\u002Fwww.realestate.com.au\u002Fagent\u002Fbernard-ryan-1797578?cid={cid}\\\",\\\"__typename\\\":\\\"AbsoluteLinks\\\"},\\\"__typename\\\":\\\"ListerLinks\\\"},\\\"showInMediaViewer\\\":true,\\\"__typename\\\":\\\"Lister\\\"}]},\\\"__typename\\\":\\\"BuySearchResultsItem\\\"},{\\\"listing\\\":{\\\"__typename\\\":\\\"BuyResidentialListing\\\",\\\"id\\\":\\\"152421420\\\",\\\"description\\\":\\\"Privately positioned on an expansive 1,163sqm family friendly block on Medusa Street, this brand-new residence delivers an exceptional blend of contemporary design and resort-style living set within beautifully landscaped gardens. Designed with a strong connection to the outdoors, the home enjoys abundant natural light, privacy and a wonderfully tranquil setting. Level access extends from the street through the home and directly to the rear garden, pool and entertaining areas. Built to an impressive 7-star energy rating, the residence showcases premium materials and considered detailing, including oversized doors and grand vaulted entry spaces. Original sandstone from the property's 1920s residence has been thoughtfully retained within the front fence and electric driveway gate, creating a unique connection to its history.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EApproximately 440sqm of internal accommodation and entertaining provides generous proportions, with three living areas and five \u002F six bedrooms. The huge gourmet kitchen features a gas cooktop, built-in refrigeration, two dishwashers and a microwave, twin electric ovens and a substantial butler's kitchen with wine fridge. Expansive sliding glass doors open to the large, covered terrace, level rear lawns, gardens, heated pool and outdoor entertaining areas. The gardens are designed by renowned landscape designer Barbara Lansberg, creating a private resort-like setting with lush planting, established greenery and multiple spaces to relax and entertain. The heated pool is complemented by a 4m x 10.2m covered alfresco area with the outdoor kitchen, while at the end of the garden a secluded firepit area with built-in seating provides a beautiful setting day and night.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThe residence has excellent natural light, with northern sun to the front bedrooms and living areas and sunshine across the rear garden and pool. The oversized main bedroom enjoys sweeping views towards Sydney CBD and includes an impressive ensuite with a generous dressing room. Additional features include zoned air conditioning, EV charging port, a commercial-sized gas fireplace, extensive storage, a large family laundry and internal access from the double garage. There is also room for 1 or 2 more cars off the street in the driveway\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThe property is 600m from Chinamans Beach and about 1km down to Middle Harbour, the Spit Marinas and waterfront dining. Mosman Village and Balmoral Beach are a 6-minute drive away. Middle Harbour Public School is on Medusa Street and there are regular bus services on the street to provide convenient access to North Sydney and the Sydney CBD. The Scots College Eastern Suburbs school bus also has a stop on the street providing easy access to Eastern Suburbs private schools. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EAn exceptional opportunity to secure a brand-new family residence on a substantial landholding in one of Mosman's most desirable locations.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EPrice Guide: $9,000,000 - $9,500,000\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EInspect: Sat\u002FWed 1.00pm to 1.40pm or by appointment\u003Cbr\u002F\u003EAuction: 5.00pm, Wednesday 11th November \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EContact Agents: \u003Cbr\u002F\u003EJason Guildea 0411 859 505 \u003Cbr\u002F\u003EAimee Welch 0401 422 554 \u003Cbr\u002F\u003ELisa Wenban 0423 880 016\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E*Agent Interest*\u003Cbr\u002F\u003E\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fbfb65261411893fa38d51bc2a76634144157ee8894c02005fd3a6860aabd65cf\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"images\\\":[{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fbfb65261411893fa38d51bc2a76634144157ee8894c02005fd3a6860aabd65cf\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fe27839e5eb58ffbbd7db39e83c5ee677715d134f64892fb6faea6fddcb0cd7b3\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F462f923e84289c7dd9361da261533c4988954fc472d0d1fc490049b89dab6fcd\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fb3aee14949f8e8e2af88fafd85372285bbfd453fae56fa641e012746218ad015\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F80edf38659a7cc0a9125bc7aecc29625e3214cdc85986820481329fcd9748d14\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F37e452a779c14bd730c0efd7936f1c6edf17ca6652b8f3ed66fa347b1184406e\u002Fi graceful curved Art Deco walls, soaring natural light and sweeping harbour outlooks extending across Watsons Bay to the Pacific Ocean. With windows on all four aspects and no shared common walls, the home enjoys an exceptional sense of privacy, independence and natural cross-flow ventilation. For the cooler months the home is complemented by a gas ducted heating system. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThe generous 183sqm layout is complemented by classic white plantation shutters, adding a timeless elegance throughout. A grand formal entry foyer leads into a wide hallway, creating a natural separation between the bedroom accommodation and the expansive living spaces.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EAt the heart of the home, the expansive kitchen opens seamlessly to the everyday living and dining area, with a generous island bench providing both functionality and a natural gathering point. Framed by the home's distinctive curved walls, the living and dining spaces take full advantage of the spectacular harbour outlook.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EExtending the living experience outdoors, a large private terrace with picturesque harbour views provides an exceptional setting for alfresco dining, entertaining and relaxed afternoons with family and friends. Capturing the beauty of the surrounding harbour and coastal landscape, it creates a seamless connection between the home's elegant interiors and its idyllic outdoor setting.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThe boutique security building comprises just nine residences arranged across two low-rise towers, creating an intimate and tightly held setting adjoining the reserve.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EBeyond the home, the location captures the very best of Mosman's harbourside lifestyle. Clifton Gardens and Balmoral Beach are both within easy reach, with picturesque waterfront walking trails providing a beautiful extension of the local landscape. Military Road and Mosman Villag SearchResultsItem\\\"},{\\\"listing\\\":{\\\"__typename\\\":\\\"BuyResidentialListing\\\",\\\"id\\\":\\\"152791832\\\",\\\"description\\\":\\\"Set behind the gates of the coveted Tregoyd Estate on Balmoral Slopes, this freestanding Torrens Title home pairs timeless Hamptons-inspired interiors with a lush, private setting. Light-filled, beautifully finished and wrapped in tropical greenery, it offers a relaxed family lifestyle with exclusive access to a swimming pool and tennis\u002Fpickleball court. The secure, low-maintenance gated community also brings genuine lock-up-and-leave convenience, ideal for those who travel often or would rather spend their time enjoying life than maintaining a home. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThe ground floor centres on an open-plan family, living and dining zone anchored by a stone fireplace and warm timber floors. Glass doors open to a private north-facing courtyard of travertine paving, manicured gardens and a tranquil water feature, framed by a canopy of towering palms. A separate formal living room with media nook gives everyone their own space.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThe kitchen is a true centrepiece, featuring duck egg blue Shaker-style cabinetry, an oversized stone island with seating for four, Perrin & Rowe tapware and a pot filler, handmade-look subway tiles, and a butler's pantry with an integrated laundry.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EUpstairs, the master retreat opens to a private balcony overlooking the treetops, complete with a walk-in robe and an ensuite with a freestanding bath and double vanity with heated floors and towel rails. Three further bedrooms include one with its own ensuite and another with a balcony, joined by a dual-desk study and a family bathroom.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EPositioned within one of Mosman's most private gated enclaves, the home sits close to the shops, cafess and restaurants of Mosman Village, with the sand and harbour waters of Balmoral Beach also nearby. Local schools, parks and city-bound transport are all within easy reach.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E•\\\\tFour bedrooms plus study, two ensuites, main bathroom all with heated towel rails and guest WC\u003Cbr\u002F\u003E•\\\\tOpen-plan family\u002Fliving\u002Fdining with fireplace, separate formal living\u003Cbr\u002F\u003E•\\\\tFormal living with built-in media unit and French doors to the terrace\u003Cbr\u002F\u003E•\\\\tShaker-style kitchen with island, Perrin & Rowe fittings, a Wolf oven and butler's pantry\u002Flaundry\u003Cbr\u002F\u003E•\\\\tProfessional-style cooktop, brass pendant lighting and a garden outlook from the sink\u003Cbr\u002F\u003E•\\\\tMaster suite with walk-in robe, balcony and ensuite\u003Cbr\u002F\u003E•\\\\tBuilt-in robes to all secondary bedrooms, second bedroom with its own balcony\u003Cbr\u002F\u003E•\\\\tDual-desk study, ideal for working from home \u003Cbr\u002F\u003E•\\\\tPrivate landscaped courtyard and terraces with water feature and pond\u003Cbr\u002F\u003E•\\\\tMultiple alfresco dining spots surrounded by established tropical gardens\u003Cbr\u002F\u003E•\\\\tDucted air conditioning and timber floors \u003Cbr\u002F\u003E•\\\\tVideo intercom, linen cupboard and under-stair storage\u003Cbr\u002F\u003E•\\\\tDouble lock-up garage with internal access and storage, off-street and guest parking available \u003Cbr\u002F\u003E•\\\\tEstate facilities include pool, tennis court and a rainforest walkway\u003Cbr\u002F\u003E•\\\\tApprox. 247sqm internal, 338sqm total including terraces and garage\u003Cbr\u002F\u003E•\\\\tApprox. 200m to Mosman Village\u003Cbr\u002F\u003E•\\\\tApprox. 700m to Balmoral Beach\u003Cbr\u002F\u003E•\\\\tApprox. 280m to nearest bus stop\u003Cbr\u002F\u003E•\\\\tApprox. 1km to Mosman Public School and Mosman High School\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E*All information contained herein is gathered from sources we consider to be reliable. However, we cannot guarantee its accuracy and interested persons should rely on their own enquiries.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EFor more information or to arrange an inspection, please contact Geoff Smith on 0418 643 923 or Ross Nesdale on 0452 030 872\u003Cbr\u002F\u003E\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fbb560bfe88a8fd1a1811b161da3607f84a4a67d440b8ddb37b73a751cf38a8d2\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"images\\\":[{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fbb560bfe88a8fd1a1811b161da3607f84a4a67d440b8ddb37b73a751cf38a8d2\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F1abdbafad7fecd3b33521c9788aa184f87faecba22b0b68450e786da728d6311\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fcd138ff860bd609759586e3997dc1cddd9efcc43b9f08bb6ba152364724387b9\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fa3e0d29ad503ba08253ce258ed175cbc2e7aac58fca889057c5408f561fd2e32\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Ff3f6941f71a094473cc7c86f9aa57fb030bb8d986f7debea2df7c1e0ae8be9ca\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fd16f5a442af8f0437ec14fd2eb570d944de80d60c0fa6bcd0ae7a9383df49d16\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F03b50cb2009c4861fa9a2595f5cc8fcab103f3ad5c4182d46c348ba538af70fa\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F4 02F\u003EOffering exceptional potential, this distinguished residence is ready to be restored to its former grandeur and transformed into a magnificent family home in one of Mosman's most prestigious harbourside settings.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E'Kooringal' presents graceful period features including high ornate moulded ceilings, architectural frames and curves, panelled doors, leadlight windows, wide skirts, sash windows, picture rails and fireplaces. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EMostly in original condition, it has benefited from a second-storey addition in the early '80s, including a spacious open-plan living or family\u002Frumpus space with breathtaking views, a practical kitchenette, bathroom, and ample storage. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EBoasting a commanding street presence, the property occupies a substantial corner allotment on a quiet one-way street, with dual access from Arbutus Street and adjoining Evans Lane.  Kooringal enjoys breathtaking harbour views across Clontarf and Grotto Point to Manly, North Head and beyond. The enviable position is just moments from the iconic sands of Balmoral Beach, the Esplanade, local highly desirable private and public schools and to Mosman Village and Junction shopping precincts.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ERich in character and heritage, this distinguished residence presents exceptional scope to introduce contemporary comforts while preserving the architectural charm and elegance of its original design. A remarkable piece of Mosman's history, the property holds immense potential to be transformed into a grand and sophisticated family home for generations to come.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EARCHITECTURAL FEATURES :\u003Cbr\u002F\u003E- Built in 1902 and presenting charming original character\u003Cbr\u002F\u003E- Freestanding dwelling with side paths to rear of lot\u003Cbr\u002F\u003E- Front & rear established and enclosed lawn & gardens\u003Cbr\u002F\u003E- East-west orientation provides all-day sunshine\u003Cbr\u002F\u003E- Elevated position invites gentle harbour breezes\u003Cbr\u002F\u003E- Welcoming sandstone entrance, tessellated tile feature\u003Cbr\u002F\u003E- Two levels of living, grand proportions, 3.3m ceilings\u003Cbr\u002F\u003E- Wide entrance vestibule\u002Ffoyer off covered portico\u003Cbr\u002F\u003E- Flexible floorplan with substantial-sized rooms t\u002Fout\u003Cbr\u002F\u003E- Abundant natural light due to extensive use of glazing\u003Cbr\u002F\u003E- Both formal and informal living and dining  spaces\u003Cbr\u002F\u003E- Stunning original fireplaces in lounge and dining \u003Cbr\u002F\u003E- Separate covered veranda\u002Fsunroom\u002Freading room\u003Cbr\u002F\u003E- Original kitchen with pantry and abundant storage\u003Cbr\u002F\u003E- Four well-sized bedrooms, master with bay window\u003Cbr\u002F\u003E- Upper-level retreat with kitchenette and bathroom\u003Cbr\u002F\u003E- Bathrooms on upper and lower level, plus sep W\u002FC\u003Cbr\u002F\u003E- Large family-sized laundry opens directly to rear\u003Cbr\u002F\u003E- Extensive interior storage options on both levels\u003Cbr\u002F\u003E- Large under-house storage potential for wine cellar\u003Cbr\u002F\u003E- Covered outdoor alfresco patio off casual living space\u003Cbr\u002F\u003E- Rear lawned, enclosed yard with opportunity to update\u003Cbr\u002F\u003E- 2+ car lock-up garage plus u\u002Fc carport for 2 cars\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EEnjoying an enviable position in one of Mosman's most prestigious harbourside enclaves, 'Kooringal' is exceptionally well placed to enjoy the very best of the local lifestyle. Just moments from the iconic shores of Balmoral Beach, beautiful parklands and sporting fields, the home is also conveniently located close to leading schools including Queenwood, Mosman Public School and Mosman High School. The vibrant shopping and dining precincts of Mosman Village and Junction, together with excellent local ameni {\\\"id\\\":\\\"126966\\\",\\\"agentId\\\":\\\"0e763073-5430-41c9-ac2f-62a58eb11234\\\",\\\"name\\\":\\\"David Smeallie\\\",\\\"jobTitle\\\":\\\"Partner\\\",\\\"photo\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F2e4cf4b46755e326b8739b867f8e8c2b3d5376656455a7b0661c4db236bdc9be\u002Fmain.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"_links\\\":{\\\"canonical\\\":{\\\"href\\\":\\\"https:\u002F\u002Fwww.realestate.com.au\u002Fagent\u002Fdavid-smeallie-126966?cid={cid}\\\",\\\"__typename\\\":\\\"AbsoluteLinks\\\"},\\\"__typename\\\":\\\"ListerLinks\\\"},\\\"showInMediaViewer\\\":true,\\\"__typename\\\":\\\"Lister\\\"}]},\\\"__typename\\\":\\\"BuySearchResultsItem\\\"},{\\\"listing\\\":{\\\"__typename\\\":\\\"BuyResidentialListing\\\",\\\"id\\\":\\\"152220040\\\",\\\"description\\\":\\\"An exhibition of opulence, this gorgeous family residence has newly undergone an exquisite transformation curated with undeniable quality and attention to detail. Homage is paid to classic federation style exemplified by Art Deco inspired leadlight details in the front door, with custom solid sandstone steps descending to the entrance. From here, there's a clear line of sight through to the rear terrace, captivated by far-reaching views to the North Sydney skyline. Interiors reflect a curated palette of natural elements from hardwood timber floors to a selection of European marble finishes, elevating the original Californian bungalow design to a standard of unparalleled contemporary refinement. Impressive in scale, the layout provides a selection of living areas from formal lounge and dining, to open plan family living and entertaining, as well as a versatile gym. Alfresco entertaining overlooks an expansive level lawn and resort style pool amid Paul Bangay designed gardens. Upstairs, the palatial main bedroom suite opens to a balcony embracing city skyline views which encompass the Harbour Bridge. This property is nestled in a prized enclave between Sirius Cove Beach and Taronga Zoo.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EFamilies seeking a palatially scaled residence thoughtfully upgraded with luxurious finishes in a sought-after enclave. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003E• Casual living areas extend seamlessly via bi-fold doors to an expansive entertaining terrace with built-in barbecue kitchen\u003Cbr\u002F\u003E• Custom leadlight door details composed with English glass ensure rich street appeal, illuminated by Articolo light\u003Cbr\u002F\u003E• Facade accented by copper awnings and water features in precision landscaped surrounds\u003Cbr\u002F\u003E• Distinguished formal lounge and dining rooms featuring Fior di Bosco marble fireplace, high ceilings and skirting boards\u003Cbr\u002F\u003E• Monumental kitchen composed with Grigio Perlatto marble benchtops, American walnut crown cut veneer joinery\u003Cbr\u002F\u003E• Appliances include double Gaggenau ovens, Gaggenau induction cooktop and Subzero French door refrigeration\u003Cbr\u002F\u003E• In-ground pool and resort style surrounds punctuated by Tuucci umbrellas imported from Miami, garden features Spanish Bover lighting\u003Cbr\u002F\u003E• Lower level gym with adjoining bathroom provides incredible versatility of use\u003Cbr\u002F\u003E• Luxurious accommodation includes five bedrooms with built-ins including flexible fifth\u002Fstudy, and an entry level suite\u003Cbr\u002F\u003E• Main bedroom features dual walk-in wardrobes, separate air conditioning, city view terrace and a Calcutta Viola Monet marble ensuite\u003Cbr\u002F\u003E• All bathrooms finished with Italian Bottocino marble flooring and Astrawalker English brass tapware, the main with a Victoria+Albert bath tub and rainshower \u003Cbr\u002F\u003E• Four-car lock-up garage with epoxy gloss floors and internal access opens to rear lawn, adjacent store room\u003Cbr\u002F\u003E• Intercom system throughout all three levels, back-to-base alarm, zoned ducted air conditioning, Sonos sound system . Formal rooms and a selection of bedrooms elegantly retain original fireplaces, and stunning bay windows look out onto the gardens. Spilling out to open-plan living at the rear, the dining, family room and kitchen seamlessly combine for everyday functionality. Connecting to an expansive north facing terrace, the poolside outdoor entertaining is large enough to zone into alfresco dining and open-air lounging. Continually connecting inside and out, a wall of sliding windows in the shaker-style kitchen overlooks the barbecue terrace and enables you to watch kids playing upon the level lawns or within the sundrenched swimming pool. Wonderfully spacious, the kitchen is fitted with generous storage and benchtop space, a semi-integrated Smeg dishwasher, six burner gas cooktop and a 90cm under counter Fisher & Paykel oven.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EPresenting flexible accommodation options suited to growing or multi-generational families, there is a selection of relaxing bedroom retreats across both levels, the perfect vantage point for the New Year's Eve fireworks. There is the potential to convert multiple bedrooms into studies or extra living spaces. Serviced by four bathrooms, there is an ensuite off the majestic master bedroom and a dual access bathroom on the first floor. Impressive in every way, features of special appeal include a secure carport, a lockup garage, two extra off-street car spaces, subfloor cellaring, and ducted reverse cycle air conditioning.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ESet above Mosman Rowers privately basking in the natural beauty of its harbourside setting, stroll to Mosman Ferry Wharf, Old Cremorne Wharf and Cremorne Point Wharf via the nearby foreshore walking tracks. Picturesque yet incredibly convenient, local Spofforth Street shops are a 550-metre walk away and there is also easy access to leading schools and to city bus stops.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E•\\\\tMagnificent arched bay window in lounge room\u003Cbr\u002F\u003E•\\\\tFamily room and dining bathed in northern sun\u003Cbr\u002F\u003E•\\\\tSliding glass doors to terrace, retractable awning\u003Cbr\u002F\u003E•\\\\tGranite tops the timeless shaker kitchen joinery\u003Cbr\u002F\u003E•\\\\tSix burner gas cooktop and Fisher & Paykel oven\u003Cbr\u002F\u003E•\\\\tSmeg semi-integrated dishwasher, double sink\u003Cbr\u002F\u003E•\\\\tSkylit staircase, north facing balcony upstairs\u003Cbr\u002F\u003E•\\\\tHarbour and cityscape views from upper level\u003Cbr\u002F\u003E•\\\\tOrnate fireplaces in living rooms and bedrooms\u003Cbr\u002F\u003E•\\\\tSoaring ceilings\u003Cbr\u002F\u003E•\\\\tWalk-in robe and ensuite off the master bedroom\u003Cbr\u002F\u003E•\\\\tVersatile bedroom and accommodation options\u003Cbr\u002F\u003E•\\\\tBathtub and walk-in shower in primary bathroom\u003Cbr\u002F\u003E•\\\\tDual access bathroom upstairs, ample built-ins\u003Cbr\u002F\u003E•\\\\tCombined laundry room and fourth bathroom\u003Cbr\u002F\u003E•\\\\tHome office off elegant entry level bedroom\u003Cbr\u002F\u003E•\\\\tNatural rockery retained in landscaping design\u003Cbr\u002F\u003E•\\\\tHuge north facing concrete pool and sun decks\u003Cbr\u002F\u003E•\\\\tLockup garage, carport, two off-street spaces\u003Cbr\u002F\u003E•\\\\tLeadlight windows, classic pendants, ceiling roses\u003Cbr\u002F\u003E•\\\\tHigh skirting boards outline timber floorboards\u003Cbr\u002F\u003E•\\\\tDucted reverse cycle air-conditioning, three gas bayonets\u003Cbr\u002F\u003E•\\\\t100m to Mosman Rowers via Cremorne Point Walk\u003Cbr\u002F\u003E•\\\\t450m to local bus stop, 1km to IGA and cinema\u003Cbr\u002F\u003E•\\\\t550m to local Spofforth Street shops and eateries\u003Cbr\u002F\u003E•\\\\t550m to ferry wharf circling around Mosman Bay\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E*All information contained herein is gathered from sources we consider to be reliable. However we cannot guarantee its accuracy and interested persons should rely on their own enquiries

003EProperty Highlights\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E• Prestigious Level 18 position within the acclaimed One30 Hyde Park development\u003Cbr\u002F\u003E• Spectacular views across Hyde Park, St Mary's Cathedral and the Sydney skyline\u003Cbr\u002F\u003E• North-facing aspect capturing abundant natural light throughout the day\u003Cbr\u002F\u003E• Approximately 119sqm on title\u003Cbr\u002F\u003E• Expansive open-plan living and dining area with floor-to-ceiling glazing\u003Cbr\u002F\u003E• Winter garden offering year-round enjoyment and seamless indoor-outdoor living\u003Cbr\u002F\u003E• Designer stone kitchen appointed with integrated Gaggenau appliances\u003Cbr\u002F\u003E• Two generously proportioned bedrooms with built-in wardrobes\u003Cbr\u002F\u003E• Luxurious master suite with ensuite bathroom\u003Cbr\u002F\u003E• Premium bathrooms finished with high-quality fixtures and fittings\u003Cbr\u002F\u003E• Ducted air conditioning, internal laundry and ample storage\u003Cbr\u002F\u003E• Secure car space and private storage cage\u003Cbr\u002F\u003E• Concierge service, resident gymnasium and BBQ facilities\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ELifestyle\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EOne30 Hyde Park is recognised as one of Sydney's premier residential addresses, offering an unrivalled lifestyle at the crossroads of the city's business, cultural and entertainment precincts. Step outside to Hyde Park's open green spaces, enjoy world-class dining and luxury shopping, or connect effortlessly to the rest of Sydney via Museum Station located directly below the building.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EA residence of enduring quality and prestige, offering luxury park-side living in the heart of Sydney's CBD.\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F442f1a29d98ea84e08a1b11ecb5e006c880065a47523761971f2a9e4d082e0d0\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"images

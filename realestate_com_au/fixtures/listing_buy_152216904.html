estate.com.au\u002Fplanner?sourcePage=rea:buy:property_details&sourceElement=see_planned_inspections_pdp\\\",\\\"__typename\\\":\\\"EventsNavigationAction\\\"},\\\"__typename\\\":\\\"InspectionsComponentImpl\\\"},\\\"__typename\\\":\\\"InspectionsComponent\\\"},\\\"AuctionComponent\\\":{\\\"component\\\":null,\\\"__typename\\\":\\\"AuctionComponent\\\"},\\\"DisplaySuiteComponent\\\":{\\\"component\\\":null,\\\"__typename\\\":\\\"DisplaySuiteComponent\\\"},\\\"DeveloperInspectionsComponent\\\":{\\\"component\\\":null,\\\"__typename\\\":\\\"DeveloperInspectionsComponent\\\"},\\\"IREInspectionRegistrationTimesComponent\\\":{\\\"component\\\":null,\\\"__typename\\\":\\\"IREInspectionRegistrationTimesComponent\\\"},\\\"IREInspectionEnquiryMessageComponent\\\":{\\\"component\\\":null,\\\"__typename\\\":\\\"IREInspectionEnquiryMessageComponent\\\"},\\\"BuildingReportDetailsComponent\\\":{\\\"component\\\":null,\\\"__typename\\\":\\\"BuildingReportDetailsComponent\\\"},\\\"BuildingReportSummaryComponent\\\":{\\\"component\\\":null,\\\"__typename\\\":\\\"BuildingReportSummaryComponent\\\"},\\\"PropertyDescriptionComponent\\\":{\\\"component\\\":{\\\"title\\\":\\\"A landmark estate on 2,668sqm with sweeping harbour panoramas\\\",\\\"address\\\":\\\"1 Buena Vista Avenue, Mosman\\\",\\\"summary\\\":\\\"Opportunities of this scale have only presented themselves a handful of times across the Lower North Shore in the past decade. Set on 2,668sqm with expansive harbour views and a landmark c1903 residence, this is a true estate - the kind of landholding, position and scale that simply cannot be recreated.\\\\n\\\\nPositioned at the quiet southern end of Buena Vista Avenue, the home is deliberately oriented towards the harbour rather than the street, capturing sweeping 180-degree panoramas across Taylors Bay towards Rose Bay, Shark Island and the ocean horizon.\\\\n\\\\nEstablished bushland borders the southern boundary, creating a green and uninterrupted outlook, while the northerly aspect draws sunlight across the lawns, gardens and terraces throughout the day. The sense of privacy is exceptional, with the scale of the block allowing the residence to sit comfortably within its surrounds rather than dominate them.\\\\n\\\\nInside, the proportions are generous and beautifully suited to family living. Formal living and dining rooms sit either side of a wide central foyer, while an expansive 10-metre family room and stone-finished Miele kitchen open seamlessly to the sweeping curved terrace, pool and gardens beyond.\\\\n\\\\nSix bedrooms are arranged across two levels, including a substantial main suite with its own harbour-view balcony. A ground-floor bedroom provides flexibility for guests, extended family or multi-generational living.\\\\n\\\\nThe lower level adds another layer to the home's entertaining credentials, with a wine cellar and pool cabana, while the upper balconies capture the harbour from multiple aspects.\\\\n\\\\nBeyond the gates, a sweeping driveway reinforces the sense of arrival, leading to a double lock-up garage with additional off-street parking for three vehicles.\\\\n\\\\nA genuine Lower North Shore estate of extraordinary rarity - combining a landmark residence, 2,668sqm of land and expansive harbour views in one of Mosman's most tightly held settings.\\\\n\\\\n• Level 2,668sqm north-facing landholding in one of Mosman's most tightly held pockets\\\\n• Expansive 180-degree harbour panoramas across Taylors Bay towards Rose Bay, Shark Island and the ocean horizon\\\\n• Landmark c1903 residence positioned to maximise the harbour outlook\\\\n• Established bushland along the southern boundary providing privacy and an uninterrupted green outlook\\\\n• Six bedrooms across two levels, including a main suite with private harbour-view balcony\\\\n• Formal living and dining rooms plus an expansive 10-metre family room\\\\n• Stone-finished kitchen with Miele appliances opening directly to the terrace\\\\n• Sweeping curved entertainer's terrace overlooking the pool, lawns and harbour\\\\n• Wine cellar and pool cabana on the lower-ground level\\\\n• Sandstone foundations, soaring ceilings and ducted air conditioning\\\\n• Double lock-up garage plus off-street parking for a further three vehicles\\\\n\\\\nArtist’s impressions and concept plans have been prepared by Hampton Architecture for illustrative purposes only. They are not approved plans and do not form part of the sale. Any future development is subject to council and other approvals, which may not be granted, and the final design may differ. Interested parties should obtain their own planning advice.\\\",\\\"readMoreButton\\\":{\\\"eventSchemaData\\\":\\\"{\\\\\\\"schema\\\\\\\":\\\\\\\"iglu:au.com.realestate\u002Flisting_description_read_more\u002Fjsonschema\u002F1-0-0\\\\\\\",\\\\\\\"data\\\\\\\":{\\\\\\\"event_name\\\\\\\":\\\\\\\"listing_description_read_more\\\\\\\",\\\\\\\"listing_id\\\\\\\":\\\\\\\"152216904\\\\\\\"}}\\\",\\\"__typename\\\":\\\"ReadMoreButtonType\\\"},\\\"publishedDate\\\":null,\\\"__typename\\\":\\\"PropertyDescriptionComponentImpl\\\"},\\\"__typename\\\":\\\"PropertyDescriptionComponent\\\"},\\\"PropertyHighlightsComponent\\\":{\\\"component\\\":{\\\"title\\\":\\\"Property highlights\\\",\\\"longSubtitle\\\":\\\"AI-generated from property description. Highlights may differ from the actual property. Verify highlights against the property description and in person.\\\",\\\"listingEventId\\\":\\\"listing-b63d2177-c0db-4d4a-83b9-bc066ab20dbe\\\",\\\"disclaimer\\\":{\\\"title\\\":\\\"Property highlights\\\",\\\"description\\\":\\\"We use AI to spot and summarise key property features from the property description provided by the real estate agent. While it's a useful starting point, the AI can sometimes get it wrong, so we recommend reading the full property description and confirming these features in person during your inspection. Realestate.com.au does not validate these features and makes no warranty or repres \u002Fi2.au.reastatic.net\u002F{size}\u002Fd46af49e27ef1f9b2ee1d43972b2dc061b4c5ef681ee12e66d2c2bd0e057e433\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F6a162ca86713c1e82fb9c187610f1facd8c58217b0499a89609e9b1fb54e5354\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F66bcc37ef766cfcb26e61a20ed8fbf04c7a5026afdb46774dd5fa51e012e70d5\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"}],\\\"floorplans\\\":[{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F1d0a270ec3132cbee2d8ae006b77b4df0bf046c2358278be518503e0218aa1da\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"}],\\\"threeDimensionalToursCompat\\\":[],\\\"videos\\\":[{\\\"id\\\":\\\"bjeZjKpw_fw\\\",\\\"__typename\\\":\\\"YouTubeVideo\\\"}],\\\"threeDimensionalTours\\\":[]},\\\"inspections\\\":[{\\\"display\\\":{\\\"longLabel\\\":\\\"Inspection tomorrow 1:30 pm\\\",\\\"__typename\\\":\\\"InspectionDisplay\\\"},\\\"__typename\\\":\\\"Inspection\\\",\\\"startTime\\\":\\\"2026-10-31T13:30:00+11:00\\\",\\\"endTime\\\":\\\"2026-10-31T14:00:00+11:00\\\"}],\\\"description\\\":\\\"Opportunities of this scale have only presented themselves a handful of times across the Lower North Shore in the past decade. Set on 2,668sqm with expansive harbour views and a landmark c1903 residence, this is a true estate - the kind of landholding, position and scale that simply cannot be recreated.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EPositioned at the quiet southern end of Buena Vista Avenue, the home is deliberately oriented towards the harbour rather than the street, capturing sweeping 180-degree panoramas across Taylors Bay towards Rose Bay, Shark Island and the ocean horizon.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EEstablished bushland borders the southern boundary, creating a green and uninterrupted outlook, while the northerly aspect draws sunlight across the lawns, gardens and terraces throughout the day. The sense of privacy is exceptional, with the scale of the block allowing the residence to sit comfortably within its surrounds rather than dominate them.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EInside, the proportions are generous and beautifully suited to family living. Formal living and dining rooms sit either side of a wide central foyer, while an expansive 10-metre family room and stone-finished Miele kitchen open seamlessly to the sweeping curved terrace, pool and gardens beyond.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ESix bedrooms are arranged across two levels, including a substantial main suite with its own harbour-view balcony. A ground-floor bedroom provides flexibility for guests, extended family or multi-generational living.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThe lower level adds another layer to the home's entertaining credentials, with a wine cellar and pool cabana, while the upper balconies capture the harbour from multiple aspects.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EBeyond the gates, a sweeping driveway reinforces the sense of arrival, leading to a double lock-up garage with additional off-street parking for three vehicles.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EA genuine Lower North Shore estate of extraordinary rarity - combining a landmark residence, 2,668sqm of land and expansive harbour views in one of Mosman's most tightly held settings.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E• Level 2,668sqm north-facing landholding in one of Mosman's most tightly held pockets\u003Cbr\u002F\u003E• Expansive 180-degree harbour panoramas across Taylors Bay towards Rose Bay, Shark Island and the ocean horizon\u003Cbr\u002F\u003E• Landmark c1903 residence positioned to maximise the harbour outlook\u003Cbr\u002F\u003E• Established bushland along the southern boundary providing privacy and an uninterrupted green outlook\u003Cbr\u002F\u003E• Six bedrooms across two levels, including a main suite with private harbour-view balcony\u003Cbr\u002F\u003E• Formal living and dining rooms plus an expansive 10-metre family room\u003Cbr\u002F\u003E• Stone-finished kitchen with Miele appliances opening directly to the terrace\u003Cbr\u002F\u003E• Sweeping curved entertainer's terrace overlooking the pool, lawns and harbour\u003Cbr\u002F\u003E• Wine cellar and pool cabana on the lower-ground level\u003Cbr\u002F\u003E• Sandstone foundations, soaring ceilings and ducted air conditioning\u003Cbr\u002F\u003E• Double lock-up garage plus off-street parking for a further three vehicles\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EArtist’s impressions and concept plans have been prepared by Hampton Architecture for illustrative purposes only. They are not approved plans and do not form part of the sale. Any future development is subject to council and other approvals, which may not be granted, and the final design may differ. Interested parties should obtain their own planning advice.\u003Cbr\u002F\u003E\\\",\\\"auction\\\":null,\\\"productDepth\\\":\\\"premiere\\\",\\\"introduction\\\":null,\\\"listers\\\":[{\\\"id\\\":\\\"2218118\\\",\\\"agentId\\\":\\\"15b26550-91f6-4608-84c5-70afe07a1dc8\\\",\\\"name\\\":\\\"Michael Coombs\\\",\\\"jobTitle\\\":\\\"Director\\\",\\\"photo\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F2e684b253e04ad7f0263341ef5f3576895798ca0c00ca79708ffafbf5bfc7256\u002Fmain.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"_links\\\":{\\\"canonical\\\":{\\\"href\\\":\\\"https:\u002F\u002Fwww.realestate.com.au\u002Fagent\u002Fmichael-coombs-2218118?cid={cid}\\\",\\\"__typename\\\":\\\"AbsoluteLinks\\\"},\\\"__typename\\\":\\\"ListerLinks\\\"},\\\"showInMediaViewer\\\":true,\\\"__typename\\\":\\\"Lister\\\",\\\"listerRatingsReviews\\\":{\\\"avgRating\\\":5,\\\"totalReviews\\\":15,\\\"__typename\\\":\\\"ListerRatingsReviews\\\"}},{\\\"id\\\":\\\"3152936\\\",\\\"agentId\\\":null,\\\"name\\\":\\\"Tia Naris\\\",\\\"jobTitl

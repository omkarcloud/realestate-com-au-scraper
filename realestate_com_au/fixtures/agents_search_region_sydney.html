"provider\":\"youtube\",\"title\":\"Sydney Cove Property - A Place To Call Home\"},\"yearsExperience\":null},{\"_links\":{\"profile\":{\"href\":\"https:\u002F\u002Fwww.realestate.com.au\u002Fagent\u002Fmichael-lowdon-719323\"}},\"agency\":{\"name\":\"Ray White Residential - Sydney CBD\",\"agencyId\":\"SOMAZG\",\"branding\":{\"textColor\":\"#000000\",\"primaryColor\":\"#ffe512\"},\"logo\":{\"uri\":\"\u002Fc0e028c3e3ac06faf9f2eb90614e0e8f4bdf8f5e025da657cb8f85839cf494d8\u002Fmain.jpg\",\"templatedUrl\":\"https:\u002F\u002Fi1.au.reastatic.net\u002F{size}\u002Fc0e028c3e3ac06faf9f2eb90614e0e8f4bdf8f5e025da657cb8f85839cf494d8\u002Fmain.jpg\"},\"agencyProfileUrl\":\"https:\u002F\u002Fwww.realestate.com.au\u002Fagency\u002Fray-white-residential-sydney-cbd-SOMAZG\"},\"agentReelVideo\":null,\"awards\":\"Highest Residential Sales in CBD\",\"topAgentSuburbAward\":null,\"communityInvolvement\":null,\"coverPhoto\":{\"uri\":\"\u002Ff3a36c711f40ba125be83d1bd11b11057207513b610d2be4d31dc8fb80af2f1d\u002Fmain.jpg\",\"templatedUrl\":\"https:\u002F\u002Fi1.au.reastatic.net\u002F{size}\u002Ff3a36c711f40ba125be83d1bd11b11057207513b610d2be4d31dc8fb80af2f1d\u002Fmain.jpg\"},\"description\":\"I have over 28 years’ experience working in premium residential real estate split between two of the most exciting cities to work; London and Sydney.\\n\\nI started my career working in Sydney CBD in 2007 and for the past ten years I have been the Principal of Ray White Residential Sydney CBD at the Corporate Head Office at 44 Martin Place in the heart of city.\\n\\nI want to help everyone achieve their property goals, whether it’s the sale of a one-bedroom city apartment or substantial penthouse. I have the skills, determination, access to the best systems and tech and I am also prepared to put in the hard work so that together we achieve the best result.\\n\\nOne of the major perks working in real estate is having the chance to meet so many talented and interesting people, many clients have been at the forefronts of their fields in medicine, tech, finance, and resources. I have been very humbled to work with so many wonderful vendors and landlords.\\n\\nI have had the pleasure in negotiating the sale and lease of some of the best real estate that Sydney CBD has to offer, these include the sale and lease of many prominent penthouse homes.\\n\\nI have negotiated the sale of both the Penthouse and Sub-Penthouse at Quay West, Gloucester Street, The Rocks.\\n\\nI have managed to negotiate over 40 sales worth a combined $92 million in The Hyde, 157 Liverpool Street being one of the city’s most prestigious Parkside developments.\\n\\nI have negotiated the sale of over 30 sales in Stamford Residences including both penthouses at Stamford Residences for $9.1 million (2015) and $15.125 million (2020) for 28B & 28A respectively. I have managed 28B Stamford Residences on behalf of the landlord since being purchased off plan back in 2015.\\n\\nIn 2018 I negotiated the sale of the penthouse in 185 Macquarie Street for $8.2 million.\\n\\nIn 2016 my colleague and I ran a campaign on behalf of the government authority Property NSW, and we achieved the highest price for a site in Millers Point at $12.3 million.\\n\\nOn the leasing front I have managed to break the weekly rental figures several times, including the largest lease negotiated in the city.\\n\\nThe one ethos which is the biggest strength of Ray White Residential Sydney CBD may sound initially unconventional, but we strive by this mission statement: “We can afford not to sell your property”.\\n\\nWe work in an industry which is completely results driven. Agents earn commission based on sales activity. The structure within the company means we can act with impartiality to offer unbiased advice to put our client’s needs first above all others. Therefore, if we believe a transaction is not in the best interest of clients, we will tell them.\\n\\nSuffice to say I love my job, having joined the Ray White team within the Corporate Head Office on Level 7 Henry Davis York Building, 44 Martin Place. I work alongside so many like-minded property professionals. Within every department, every individual wants to make a difference which makes it a great environment to work.\\n\\nWithin the office there is expertise in the following areas including Commercial Sales, Commercial Leasing, Agriculture, Developments, Project Marketing, Financial Services and Ray White Capital.\\n\\nWhatever your “property need” I am on hand to offer guidance and professional advice and if I cannot help, I am positive there will be a property professional who will be able to assist at 44 Martin Place.\",\"friendlyName\":\"Michael\",\"inclusions\":[\"searchAgentLatestReview\",\"searchAgentCompliments\",\"profileAgentAgencyBrandingStrap\",\"searchRecentlySold\",\"agentReelVideo\",\"searchAgentReelVideo\",\"profileAgentAboutAppraisalCard\",\"profileAgentExtendedContactSheet\",\"profileBrandedReviewsCard\",\"profileAboutAgentVideoAndAppraisalButton\",\"reviewsGoogleBusinessSyndication\",\"searchAgentAgencyBranding\",\"profileAgentAndAgencyContactCard\",\"listingPhotoCarousel\",\"profileLargeProfile\",\"profileExpandedPerformanceSnapshot\",\"profileSocialLinks\",\"searchAgentRecentlySold\",\"searchAgentVideo\",\"profileAgentExtendedAboutAppraisalCard\",\"profileAgentPerformanceHighlight\",\"profileBrandedEnquiryContactCard\",\"agentVideo\",\"compliments\",\"profileCoverImage\",\"weeklyWrapEmailBranding\",\"searchAgentLargeAgencyBranding\"],\"jobTitle\":\"Director\",\"listings\":{\"salesBreakdown\":{\"apartment\":{\"count\":15,\"medianDaysOnSite\":51.5,\"medianSoldPrice\":1486000},\"house\":{\"count\":1,\"medianDaysOnSite\":null,\"medianSoldPrice\":6600000},\"townhouse\":{\"count\":0,\"medianDaysOnSite\":null,\"medianSoldPrice\":null}},\"stats\":{\"medianLeasedPrice\":1175,\"medianSoldDaysOnSite\":51.5,\"medianSoldPrice\":1518000,\"sumLeasedProperties\":20,\"sumSoldProperties\":16,\"sumSoldPropertiesPrimaryLister\":16,\"s lar Girls Campus\\nManly Fun Run\\nManly Malibu Boardriders\\nManly Observer\\nManly Warringah Touch\\nManly Writers Festival\\nMimosa Public School\\nNewport Junior Rugby\\nNick Connor | Sailing\\nNorthern Beaches Council Christmas Carols\\nQueenscliff Amateur Swimming Club\\nQueenscliff Board Riders Association\\nQueenscliff Surf Life Saving Club \\nSt Cecilia’s Catholic Primary School, Balgowlah\",\"coverPhoto\":{\"uri\":\"\u002F383b03363443b5a35e26373aba395ca86baca932143badbb209bbade24b93c09\u002Fmain.jpg\",\"templatedUrl\":\"https:\u002F\u002Fi1.au.reastatic.net\u002F{size}\u002F383b03363443b5a35e26373aba395ca86baca932143badbb209bbade24b93c09\u002Fmain.jpg\"},\"description\":\"With extensive local knowledge and a proven sales track record on the Northern Beaches, Matt is a highly experienced sales agent dedicated to delivering exceptional service. Holding a Licensed Real Estate Agent qualification and an Associate Diploma in Business (Valuation), Matt brings a depth of industry knowledge and business experience to every transaction. Having previously owned his own agencies, he now prefers working within an established business, allowing him to focus on what he enjoys most: helping people and selling real estate.\\n\\nMatt’s career is driven by a genuine love for both people and property. His empathetic approach, combined with his calm demeanour and strong market insight, adds meaningful value to every sale. Guided by integrity and transparency, he places great importance on building genuine relationships, with many of his clients returning through repeat and referral business. Matt is motivated by achieving the best possible outcomes for buyers and sellers alike, delivering service with energy, care and consistency.\\n\\nBorn and bred on the Northern Beaches, Matt’s life centres around his family, fitness and the coastal lifestyle. His parents built their home in Campbell Parade, Manly Vale, in 1954, where his mum still lives, and for many years Matt has called

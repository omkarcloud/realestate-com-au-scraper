iere\\\",\\\"introduction\\\":null,\\\"listers\\\":[{\\\"id\\\":\\\"2218118\\\",\\\"agentId\\\":\\\"15b26550-91f6-4608-84c5-70afe07a1dc8\\\",\\\"name\\\":\\\"Michael Coombs\\\",\\\"jobTitle\\\":\\\"Director\\\",\\\"photo\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F2e684b253e04ad7f0263341ef5f3576895798ca0c00ca79708ffafbf5bfc7256\u002Fmain.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"_links\\\":{\\\"canonical\\\":{\\\"href\\\":\\\"https:\u002F\u002Fwww.realestate.com.au\u002Fagent\u002Fmichael-coombs-2218118?cid={cid}\\\",\\\"__typename\\\":\\\"AbsoluteLinks\\\"},\\\"__typename\\\":\\\"ListerLinks\\\"},\\\"showInMediaViewer\\\":true,\\\"__typename\\\":\\\"Lister\\\"},{\\\"id\\\":\\\"3090763\\\",\\\"agentId\\\":null,\\\"name\\\":\\\"Priscilla Ouvrier\\\",\\\"jobTitle\\\":\\\"Sales Agent\\\",\\\"photo\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fa3cfbbd3788a8e23ff5e26b8bd592dbd218ad1fef1cde7ffaad37517ca67a6f2\u002Fmain.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"_links\\\":{\\\"canonical\\\":{\\\"href\\\":\\\"https:\u002F\u002Fwww.realestate.com.au\u002Fagent\u002Fpriscilla-ouvrier-3090763?cid={cid}\\\",\\\"__typename\\\":\\\"AbsoluteLinks\\\"},\\\"__typename\\\":\\\"ListerLinks\\\"},\\\"showInMediaViewer\\\":false,\\\"__typename\\\":\\\"Lister\\\"}]},\\\"__typename\\\":\\\"BuySearchResultsItem\\\"},{\\\"listing\\\":{\\\"__typename\\\":\\\"BuyResidentialListing\\\",\\\"id\\\":\\\"152216904\\\",\\\"description\\\":\\\"Opportunities of this scale have only presented themselves a handful of times across the Lower North Shore in the past decade. Set on 2,668sqm with expansive harbour views and a landmark c1903 residence, this is a true estate - the kind of landholding, position and scale that simply cannot be recreated.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EPositioned at the quiet southern end of Buena Vista Avenue, the home is deliberately oriented towards the harbour rather than the street, capturing sweeping 180-degree panoramas across Taylors Bay towards Rose Bay, Shark Island and the ocean horizon.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EEstablished bushland borders the southern boundary, creating a green and uninterrupted outlook, while the northerly aspect draws sunlight across the lawns, gardens and terraces throughout the day. The sense of privacy is exceptional, with the scale of the block allowing the residence to sit comfortably within its surrounds rather than dominate them.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EInside, the proportions are generous and beautifully suited to family living. Formal living and dining rooms sit either side of a wide central foyer, while an expansive 10-metre family room and stone-finished Miele kitchen open seamlessly to the sweeping curved terrace, pool and gardens beyond.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ESix bedrooms are arranged across two levels, including a substantial main suite with its own harbour-view balcony. A ground-floor bedroom provides flexibility for guests, extended family or multi-generational living.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThe lower level adds another layer to the home's entertaining credentials, with a wine cellar and pool cabana, while the upper balconies capture the harbour from multiple aspects.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EBeyond the gates, a sweeping driveway reinforces the sense of arrival, leading to a double lock-up garage with additional off-street parking for three vehicles.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EA genuine Lower North Shore estate of extraordinary rarity - combining a landmark residence, 2,668sqm of land and expansive harbour views in one of Mosman's most tightly held settings.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E• Level 2,668sqm north-facing landholding in one of Mosman's most tightly held pockets\u003Cbr\u002F\u003E• Expansive 180-degree harbour panoramas across Taylors Bay towards Rose Bay, Shark Island and the ocean horizon\u003Cbr\u002F\u003E• Landmark c1903 residence positioned to maximise the harbour outlook\u003Cbr\u002F\u003E• Established bushland along the southern boundary providing privacy and an uninterrupted green outlook\u003Cbr\u002F\u003E• Six bedrooms across two levels, including a main suite with private harbour-view balcony\u003Cbr\u002F\u003E• Formal living and dining rooms plus an expansive 10-metre family room\u003Cbr\u002F\u003E• Stone-finished kitchen with Miele appliances opening directly to the terrace\u003Cbr\u002F\u003E• Sweeping curved entertainer's terrace overlooking the pool, lawns and harbour\u003Cbr\u002F\u003E• Wine cellar and pool cabana on the lower-ground level\u003Cbr\u002F\u003E• Sandstone foundations, soaring ceilings and ducted air conditioning\u003Cbr\u002F\u003E• Double lock-up garage plus off-street parking for a further three vehicles\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EArtist’s impressions and concept plans have been prepared by Hampton Architecture for illustrative purposes only. They are not approved plans and do not form part of the sale. Any future development is subject to council and other approvals, which may not be granted, and the final design may differ. Interested parties should obtain their own planning advice.\u003Cbr\u002F\u003E\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fef6ac56c34bf97050b475edb963a58651da0e12cd19c7af3d274e290d380d8cb\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"images\\\":[{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fef6ac56c34bf97050b475edb963a58651da0e12cd19c7af3d274e290d380d8cb\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F29cd7ec8278ca7787a970d0a471872fdb20e8544156459829d583e5b5517a1d4\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"ht aces designed for comfort, leisure and grand-scale entertaining. Exquisitely designed interiors of exceptional artistry feature premium materials, statement sculpted stone and designer fittings, combining timeless elegance, tailored luxury and contemporary sophistication. Unfolding across three spectacular levels, the residence offers expansive spaces for living and entertaining, intimate retreats plus a dedicated poolside level for leisure and cinematic enjoyment. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EDiscover the gourmet kitchen, featuring high-calibre appliances and an integrated butler's pantry with an industrial-sized cool room, complemented by a premium barbecue for a refined culinary experience. The residence boasts exquisite bedroom suites and bathrooms, including a lavish master with a designer dressing room and a couple's ensuite with dual showers, vanities and a lavish bathtub. A spa-inspired fitness and relaxation hub, formal sitting and library, deluxe wine cellar, state-of-the-art theatre, multi-car garage with turntable and smart home technology complete this residence, set in a leafy harbour enclave with effortless beachside convenience\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E• Tri-level architectural masterpiece showcasing expansive living and grand-scale luxury throughout\u003Cbr\u002F\u003E• Exquisitely sculptured interior, combining beauty with functionality for family and guest enjoyment\u003Cbr\u002F\u003E• Seamlessly flowing to outdoor entertaining spaces, boasting an illuminated infinity swimming pool\u003Cbr\u002F\u003E• Beautifully landscaped backyard, bespoke fire pit lounge plus a high-performance outdoor cinema\u003Cbr\u002F\u003E• Calming leafy backdrop with serene views and exclusive right-of-way access to Sirius Cove Beach\u003Cbr\u002F\u003E• High-end kitchen, entertainment bar, temperature-controlled wine cellar and deluxe barbecue area - industrial-sized cool-room\u003Cbr\u002F\u003E• Five luxurious bedrooms, balcony vantage point chanting dimension to this one-of-a-kind waterfront setting.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EDesigned by renowned architect Patrick Nicholas, it combines remarkable versatility with generous scale, where a series of beautifully considered zones provides spaces for quiet retreat, relaxed family living and effortless entertaining, while a self-contained lower level creates an ideal haven for teens, guests or extended family.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EBathed in natural light and enjoying complete privacy, the residence remains wonderfully connected, with buses, waterfront dining, Middle Harbour Yacht Club and Chinamans Beach all within easy reach.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EKey features:\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E- Magnificent panorama over Middle Harbour to The Heads and the ocean\u003Cbr\u002F\u003E- Incredible architectural masterpiece by the acclaimed Patrick Nicholas\u003Cbr\u002F\u003E- Expansive living areas wrapped in walls of glass and bathed in natural light\u003Cbr\u002F\u003E- Stunning open living\u002Fdining zones with striking gas fireplace centrepiece\u003Cbr\u002F\u003E- New chef's Caesarstone kitchen w\u002F premium integrated Miele appliances\u003Cbr\u002F\u003E- Induction cooktop, integrated Liebherr fridge\u002Ffreezer, walk-in pantry\u003Cbr\u002F\u003E- Seamless indoor-outdoor transitions to fabulous alfresco entertaining\u003Cbr\u002F\u003E- Heated infinity-edge swimming pool with poolside cabana and level lawn\u003Cbr\u002F\u003E- Bedroom level with four substantial bedrooms enjoying harbour views\u003Cbr\u002F\u003E- Three bedrooms with built-in wardrobes and built-in workstations\u003Cbr\u002F\u003E- Three bathrooms (one with bath) with underfloor heating\u003Cbr\u002F\u003E- Home office with built-in desks and cupboards\u003Cbr\u002F\u003E- Serene master with WIR & BIR, deluxe ensuite with underfloor heating\u003Cbr\u002F\u003E- Extensive storage, boat shed, 300 bottle rock wine cellar, workshop\u0 \\"__typename\\\":\\\"ListerLinks\\\"},\\\"showInMediaViewer\\\":false,\\\"__typename\\\":\\\"Lister\\\"}]},\\\"__typename\\\":\\\"BuySearchResultsItem\\\"},{\\\"listing\\\":{\\\"__typename\\\":\\\"BuyResidentialListing\\\",\\\"id\\\":\\\"151405472\\\",\\\"description\\\":\\\"Developed and constructed by multi-award-winning HELM, this exceptional residence is now complete and presents a rare opportunity to experience brand-new luxury without the wait. Delivering an uncompromising standard of craftsmanship, sophistication and scale, it offers an impressive 356sqm on title, with expansive interiors, two private outdoor entertaining areas, four secure parking spaces and an abundance of storage.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ELight-filled and triple aspect, with an extensive northern frontage, the residence enjoys tranquil outlooks across Mosman Park and Allan Border Oval while sitting just moments from Mosman Village. With the building now complete, residents can immediately enjoy effortless access to the area's renowned cafes, boutiques and harbour lifestyle.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EBeautifully curated throughout, the interiors showcase a refined palette of rich timber finishes, tactile natural stone, bespoke joinery and elegant soft curves. Coffered ceilings reaching 3.16 metres, complemented by integrated LED strip lighting and a built-in Sonos sound system, amplify the sense of space across the living and dining zones. A feature Escen gas fireplace and concealed cabinetry create a seamless and sophisticated living environment, while walls of glass connect the interiors to generous private terraces for year-round entertaining and relaxed alfresco living.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EAt the heart of the home, the designer kitchen combines sculptural beauty with outstanding functionality. Marble scalloped benchtops, timber veneer cabinetry, a fully integrated Sub-Zero refrigerator, Wolf appliances, Sub-Zero wine refrigeration and an oversized pantry are complemented by a Zip tap providing chilled, boiling and sparkling water. A glass-fronted walk-in cellar and custom bar, finished with marble benchtops and surround and a smoked mirror rear panel, further elevate the entertaining experience. The private terrace is equipped with a built-in Wolf barbecue and beverage centre for effortless hosting.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EAccommodation is equally impressive, with three luxurious bedroom suites, each with its own ensuite. The palatial master retreat features premium wool carpet, a skylit dressing room with custom cabinetry and centre island drawers, and a lavish ensuite with dual vanities, heated floors, heated towel rails and separate shower and toilet.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EA dedicated media room, custom-fitted study, full laundry with Miele appliances and advanced home automation complete a residence that sets a new benchmark for completed luxury apartment living in Mosman.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EFeatures\u003Cbr\u002F\u003E• Completed and ready for immediate occupation\u003Cbr\u002F\u003E• Developed and constructed by multi-award-winning HELM\u003Cbr\u002F\u003E• Rare opportunity to secure a completed luxury residence of this calibre in Mosman\u003Cbr\u002F\u003E• Exceptional 356sqm on title, including 215sqm of internal living space\u003Cbr\u002F\u003E• Rare triple aspect residence with extensive northern frontage\u003Cbr\u002F\u003E• Expansive living and dining areas with 3.16m coffered ceilings and integrated LED strip lighting\u003Cbr\u002F\u003E• Two generous private entertaining terraces\u003Cbr\u002F\u003E• Built-in Wolf barbecue and beverage centre\u003Cbr\u002F\u003E• Designer kitchen with marble scalloped benchtops and timber veneer cabinetry\u003Cbr\u002F\u003E• Wolf appliances, integrated Sub-Zero refrigeration and wine fridge and oversized walk-in pantry\u003Cbr\u002F\u003E• Glass-fronted walk-in cellar and custom marble-finished bar\u00  against a breathtaking natural backdrop. A level basketball court and expansive landscaped gardens further enhance the lifestyle appeal.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EAt the heart of the home, the gourmet kitchen, fitted with premium Ilve appliances and exquisite natural stone finishes, takes full advantage of the stunning water views. A built-in Leibherr refrigerator and freezer complete the space, ensuring both style and functionality. Wine connoisseurs will appreciate the fully equipped and expansive wine cellar, perfect for curating an exceptional collection.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThis home is as practical as it is luxurious, with the potential for separate guest or in-law accommodation, a double lock-up garage, and additional parking for three vehicles.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ENestled in one of Mosman's most exclusive enclaves, this residence offers unparalleled privacy and prestige, just moments from Mosman's vibrant village, pristine harbour beaches, and elite schools. A rare offering of scale, sophistication, and spectacular views, this is an opportunity not to be missed.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EDisclaimer : All information contained herein is gathered from sources we believe reliable.  We have no reason to doubt its accuracy, however we cannot guarantee it. All interested parties should make and rely upon their own enquiries.\u003Cbr\u002F\u003E\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F64b877e1671bf539ad425ff9d959b29fd6198e6475e51b06904f39b175fb6344\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"images\\\":[{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F64b877e1671bf539ad425ff9d959b29fd6198e6475e51b06904f39b175fb6344\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fe e510e50d\\\",\\\"name\\\":\\\"Richard Simeon\\\",\\\"jobTitle\\\":\\\"Founder & Director\\\",\\\"photo\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F57ad5114c37460e219ba9d51072ff9d020599b16002c245a9d7099b2e7f17bea\u002Fmain.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"_links\\\":{\\\"canonical\\\":{\\\"href\\\":\\\"https:\u002F\u002Fwww.realestate.com.au\u002Fagent\u002Frichard-simeon-1007087?cid={cid}\\\",\\\"__typename\\\":\\\"AbsoluteLinks\\\"},\\\"__typename\\\":\\\"ListerLinks\\\"},\\\"showInMediaViewer\\\":false,\\\"__typename\\\":\\\"Lister\\\"},{\\\"id\\\":\\\"3946036\\\",\\\"agentId\\\":\\\"49171c0a-f535-411e-a8e8-f64e1e15554a\\\",\\\"name\\\":\\\"Vivie Li\\\",\\\"jobTitle\\\":\\\"Sales Agent\\\",\\\"photo\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fb4bf7c78b457880a6f4c38954636746d206728b6131908cbc4ec2a487384507c\u002Fmain.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"_links\\\":{\\\"canonical\\\":{\\\"href\\\":\\\"https:\u002F\u002Fwww.realestate.com.au\u002Fagent\u002Fvivie-li-3946036?cid={cid}\\\",\\\"__typename\\\":\\\"AbsoluteLinks\\\"},\\\"__typename\\\":\\\"ListerLinks\\\"},\\\"showInMediaViewer\\\":true,\\\"__typename\\\":\\\"Lister\\\"}]},\\\"__typename\\\":\\\"BuySearchResultsItem\\\"},{\\\"listing\\\":{\\\"__typename\\\":\\\"BuyResidentialListing\\\",\\\"id\\\":\\\"149783284\\\",\\\"description\\\":\\\"Tightly held by the original owner and masterfully engineered to maintain its prominence as one of Mosman’s largest and most luxurious single-level homes, this world-class residence featuring 5 bedrooms, 3 bathrooms, and 3 vehicle garaging is one of only 2 within the exclusive ‘Raglan Residences’. Offering 400sqm of whole-floor living, 441sqm on title including garaging, the landmark corner-positioned building, largely freestanding to 3 sides, presents as a triumph of heritage-inspired design and modern liveability from award-winning architects Giles Tribe, and is strategically located for convenience and lifestyle. It pays homage to the building that originally occupied the site and forms part of what is widely regarded as ‘Australia’s best-preserved Federation streetscape’, while the home spans the entire 1st floor and combines impressive house-like proportions with elevated seclusion and direct village prestige.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EConstructed of full brick including all internal walls for exceptional acoustic privacy, the residence offers private level access and secure lift entry directly into the home, creating a distinct sense of arrival, with triple level-from-the-street secure garaging and internal access. The interiors showcase refined architectural detailing throughout, including high tray ceilings, warm engineered oak floors, bespoke cabinetry, multizone ducted reverse-cycle air-conditioning, underfloor heating in all bathrooms and a feature gas fireplace. The floorplan is lavish in scale and exceptionally well considered, introduced by a substantial entrance foyer connecting separate living and accommodation wings. Floor-to-ceiling bifold doors off the master living and dining rooms reveal a magnificent entertaining terrace screened by greenery, complete with a built-in chef’s stainless-steel barbecue. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EA 2nd lounge provides an inviting space for relaxation or a movie room and opens to a covered balcony. All bedrooms are generous with full-height built-ins, while the master bedroom wing features a walk-in robe, an opulent ensuite with standalone bath and its own private lounge room. There is also a versatile 5th bedroom\u002Fguest suite or executive office, along with an exquisitely finished main bathroom and a large Miele-equipped laundry room. As expected in a home of this calibre, the kitchen is a chef’s showpiece, brilliantly designed for entertaining with a lengthy centre island, stunning quartz stone benchtops and a full complement of premium Miele appliances including multiple ovens, a plate warmer, induction cooktop and integrated French-door refrigerator\u002Ffreezer, plus a Bosch dishwasher. Storage is abundant with soft-close joinery and a walk-in pantry, and there is also a conservatory-style 2nd dining room flowing out to the terrace.\u003Cbr\u002F\u003E \u003Cbr\u002F\u003EOther attributes include elegant wall treatments, C-Bus smart lighting and video intercom security. The residence is footsteps to Mosman village cafés, restaurants and boutiques, with buses to the CBD at the door. Key lifestyle destinations are close by: 1.4 km to Balmoral Beach and Bathers’ Pavilion, 1.4 km to Mosman Bay Wharf, Taronga Zoo, and moments to Sirius Cove, Clifton Gardens and harbourside walking trails. Families and downsizers are destined to be impressed by this one-of-a-kind property, with proximity to highly regarded schools including Mosman Public School, Sacred Heart Catholic Primary School and Queenwood School for Girls.\u003Cbr\u002F\u003E \u003Cbr\u002F\u003EAn unparalleled residence delivering the dream Mosman Village lifestyle - superior scale, privacy and luxury on a level rarely offered.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EA resident testimonial is available upon request for buyers seeking further insight into life at ‘Raglan Residences’.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EInspect:\u003Cbr\u002F\u003EBy Appointment \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EOutgoings per quarter approximately:\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EStrata:\u003Cbr\u002F\u003E$2,041\u003Cbr\u002F\u003E \u003Cbr\u002F\u003ECouncil:\u003Cbr\u002F\u003E$579\u003Cbr\u002F\u003E \u003Cbr\u002F\u003EWater:\u003Cbr\u002F\u003E$203\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EJaime Upton\u003Cbr\u002F\u003ESydney Sotheby’s International Realty\u003Cbr\u002F\u003EM: +61 414 31 21 31\u003Cbr\u002F\u003EE: jaime.upton@sydneysothebysrealty.com\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ECo-Agent:\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EBill Kondylis\u ortless entertaining.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EGracefully blending Federation charm with contemporary luxury, this is a residence of scale, sophistication, and enduring appeal.  Refined living at its best, the golden sands of Balmoral Beach, the iconic Bathers' Pavilion and The Esplanade's celebrated dining scene are just a few footsteps away, inviting coastal walks, easy access to bus services, plus the many conveniences of Mosman Village are nearby.  Close to Queenwood Girls School and Beauty Point Public School, this delightfully tranquil character property is highly coveted and rarely offered. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EFeatures:\u003Cbr\u002F\u003E•\\\\tBlue-ribbon address, private and peaceful waterside ultra-exclusive location where you can hear the waves lapping on the beach\u003Cbr\u002F\u003E•\\\\tEstablished landscaped gardens with palm trees & shrubs, automated water system\u003Cbr\u002F\u003E•\\\\tExpansive north facing verandah with Bromic heaters, perfect to enjoy a sundowner\u003Cbr\u002F\u003E•\\\\tClassic Federation central hallway with soaring ceilings, creating a striking first impression\u003Cbr\u002F\u003E•\\\\t4 substantial ground floor bedrooms, two Travertine ensuites, WIR and a further Travertine bathroom with standalone bath and shower\u003Cbr\u002F\u003E•\\\\tElegant formal living room, with dual-sided gas log fireplace and concealed ceiling projection screen\u003Cbr\u002F\u003E•\\\\tOpen plan dining and family zones bathed in natural light, blending with designer kitchen appointed with Smeg appliances including dual ovens, 5 burner gas cooktop, integrated Liebherr fridge and freezer \u003Cbr\u002F\u003E•\\\\tWalk in laundry, European appliances, utility, and storage cupboards \u003Cbr\u002F\u003E•\\\\tExtensive garaging including separate single garage with level street access, remote gates to a further extraordinary 6-car collector's garage with turntable, workshop, TV, and internal access to living levels\u00

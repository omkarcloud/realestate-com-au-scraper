tag\":\"Punctual\"},{\"count\":6,\"tag\":\"Great negotiator\"},{\"count\":1,\"tag\":\"Great marketer\"}]},\"bestAndLatestReview\":{\"role\":\"seller\",\"rating\":5,\"content\":\"In the words of my friends and family “wow, that’s a good agent”. I’m currently living in another city. Sam coordinated the entire process of selling my Mosman apartment, from before my tenants vacated through to the final exchange, including all arrangements related to new paint, carpets and styling. Sam’s proactive management of the sale (in a declining market), local knowledge, strata expertise and timely communication made the experience stress free. Thank you Sam and Zoe, outstanding work !\"}},\"reviewSummary\":\"Sam is highly praised for his exceptional communication, market knowledge, and professionalism, making the selling process smooth and stress-free for his clients. Reviewers consistently highlight his proactive approach and ability to achieve excellent results in a challenging market.\",\"salespersonId\":\"3555568\",\"social\":{\"facebook\":\"https:\u002F\u002Fwww.facebook.com\u002FRayWhiteLNS\u002F\",\"instagram\":null,\"twitter\":null,\"linkedin\":\"https:\u002F\u002Fwww.linkedin.com\u002Fcompany\u002Fraywhitelowernorthshore\u002Fabout\u002F\"},\"specialities\":null,\"video\":{\"id\":\"ch3BmYYwk0k\",\"provider\":\"youtube\",\"title\":\"Ray White Lower North Shore Group | Our Difference\"},\"yearsExperience\":null},{\"_links\":{\"profile\":{\"href\":\"https:\u002F\u002Fwww.realestate.com.au\u002Fagent\u002Fharrison-schmidt-3536872\"}},\"agency\":{\"name\":\"Belle Property Lower North Shore Group\",\"agencyId\":\"LQEJRJ\",\"branding\":{\"textColor\":\"#ffffff\",\"primaryColor\":\"#386350\"},\"logo\":{\"uri\":\"\u002F8320367c6317462b41a37628420e26989871008d264aa74efc7f3b9671080c5e\u002Fmain.jpg\",\"templatedUrl\":\"https:\u002F\u002Fi1.au.reastatic.net\u002F{size}\u002F8320367c6317462b41a37628420e26989871008d264aa74efc7f3b9671080c5e\u002Fmain.jpg\"},\"agencyProfileUrl\":\"https:  on Sydney Harbour and following Liverpool FC. His passion for the area extends beyond property, giving clients the benefit of working with an agent who genuinely understands and champions the Mosman lifestyle.\",\"friendlyName\":\"Harrison\",\"inclusions\":[\"profileAboutAgentVideoAndAppraisalButton\",\"profileBrandedEnquiryContactCard\",\"profileAgentOnlyContactCard\",\"searchAgentReelVideo\",\"profileAgentExtendedContactSheet\",\"profileAgentAgencyBrandingStrap\",\"searchAgentAgencyBranding\",\"agentReelVideo\",\"searchAgentLatestReview\",\"reviewsGoogleBusinessSyndication\",\"profileBrandedReviewsCard\",\"profileAgentAboutAppraisalCard\"],\"jobTitle\":\"Sales Executive\",\"listings\":{\"salesBreakdown\":{\"apartment\":{\"count\":19,\"medianDaysOnSite\":25,\"medianSoldPrice\":1310000},\"house\":{\"count\":1,\"medianDaysOnSite\":56,\"medianSoldPrice\":4900000},\"townhouse\":{\"count\":0,\"medianDaysOnSite\":null,\"medianSoldPrice\":null}},\"stats\":{\"medianLeasedPrice\":null,\"medianSoldDaysOnSite\":25.5,\"medianSoldPrice\":1310000,\"sumLeasedProperties\":0,\"sumSoldProperties\":20,\"sumSoldPropertiesPrimaryLister\":14,\"sumSoldPropertiesSecondaryLister\":6},\"statsBySearchFilters\":{\"medianLeasedPrice\":null,\"medianSoldDaysOnSite\":25,\"medianSoldPrice\":1170000,\"sumLeasedProperties\":0,\"sumSoldProperties\":20,\"sumSoldPropertiesPrimaryLister\":13,\"sumSoldPropertiesSecondaryLister\":2},\"salesBreakdownBySearchFilters\":{\"other\":{\"count\":0,\"medianDaysOnSite\":null,\"medianSoldPrice\":null}}},\"recentListings\":null,\"mostActiveAtlasId\":\"9667b1e6-6afd-48ad-9e94-3bd51d251cd6\",\"name\":\"Harrison Schmidt\",\"profileImage\":{\"uri\":\"\u002Fe57726fda4eb27ed9c4b948a1dc039d83cab2a1ada3e8d6207b9cea5a8f4b040\u002Fmain.jpg\",\"templatedUrl\":\"https:\u002F\u002Fi1.au.reastatic.net\u002F{size}\u002Fe57726fda4eb27ed9c4b948a1dc039d83cab2a1ada3e8d6207b9cea5a8f4b040\u002Fmain.jpg\"},\"reviews\":{\"stats\":{\"avgRating\":5,\"totalReviews\":25,\"reviewCountInTimeRan  ranks among the region's elite agents, demonstrating a proven track record of delivering exceptional results across various property types. Since joining Pello, his results have increased by an impressive 400%, directly benefiting his vendors with standout outcomes. With a deep understanding of market trends and client needs, he employs innovative strategies to maximise property values and achieve optimal results.\\n\\nDavid’s dedication to excellence is reflected in his ability to navigate challenging market conditions, ensuring that every client receives personalised service and unparalleled expertise. This commitment has fostered long-lasting relationships and a loyal clientele, reinforcing his reputation as a trusted advisor in the real estate community.\\nDavid's Approach\\nWith a sophisticated yet straightforward business style, David prioritises integrity and honesty in every transaction. As a strong negotiator armed with valuable local insights, he works tirelessly to secure market-leading outcomes for his clients.\\nOutside the World of Property\\nOutside of real estate, David is a devoted husband to Kirrily and a proud dad to three girls, Kayla, Maybel and Olive. He actively engages in his community, participating in local events and initiatives. Family time is a priority, with weekends often spent enjoying quality moments together, whether at home or discovering new adventures. This commitment to a balanced lifestyle enriches both his personal life and his professional perspective.\",\"friendlyName\":\"David\",\"inclusions\":[\"profileAboutAgentVideoAndAppraisalButton\",\"profileBrandedEnquiryContactCard\",\"searchAgentLatestReview\",\"profileAgentAboutAppraisalCard\",\"profileBrandedReviewsCard\",\"agentVideo\",\"compliments\",\"listingPhotoCarousel\",\"profileCoverImage\",\"profileExpandedPerformanceSnapshot\",\"profileSocialLinks\",\"searchAgentCompliments\",\"searchAgentVideo\",\"searchAgentAgencyBranding\",\"profileAgentExtendedContactSheet\",\"prof ilt on trust, preparation, and discipline.\\n\\nWhat Drives Mitchell?\\nMitchell is driven by more than just a passion for property, he’s committed to helping people move forward at key moments in their lives. Every campaign is treated with focus and intent, and his clients value his ability to bring clarity to complex decisions. Known for his thoughtful negotiation style and no-nonsense communication, Mitchell takes pride in helping clients achieve strong results that stand the test of time.\\n\\nPerformance That Matters\\nHow you sell is just as important as what you sell for. Mitchell’s approach is calm, structured and purposeful, designed to build trust, remove friction, and give buyers confidence to act. From setting the strategy to negotiating the final deal, he leads with preparation, clarity and follow-through.\\n\\nMitchell’s Approach\\nClear communication is at the core of Mitchell’s service. He keeps clients in the loop, without the fluff, and adapts quickly to market shifts. Backed by the collaborative team at Pello Mosman, he offers a premium, process-driven service with a sharp eye on every detail that matters. His aim: help clients make informed, confident decisions, without the stress.\\n\\nOutside the World of Property\\nA long time Mosman local and proud father of two girls, Mitchell is a dual Finnish–Australian citizen who completed national service with the Finnish Air Force in 2009. Away from work, he’s most often found out for a run at sunrise, in the ocean, or chasing his golf swing, living with the same energy and purpose he brings to his work.\",\"friendlyName\":\"Mitchell\",\"inclusions\":[\"searchAgentLatestReview\",\"profileBrandedReviewsCard\",\"searchAgentAgencyBranding\",\"profileAgentExtendedContactSheet\",\"reviewsGoogleBusinessSyndication\",\"profileAgentAndAgencyContactCard\",\"compliments\",\"listingPhotoCarousel\",\"profileLargeProfile\",\"profileCoverImage\",\"searchAgentRecentlySold\",\"searchAgentVideo\",\"profileAgentAboutApp r\":\"#000000\",\"primaryColor\":\"#ffe512\"},\"logo\":{\"uri\":\"\u002Fc0e028c3e3ac06faf9f2eb90614e0e8f4bdf8f5e025da657cb8f85839cf494d8\u002Fmain.jpg\",\"templatedUrl\":\"https:\u002F\u002Fi1.au.reastatic.net\u002F{size}\u002Fc0e028c3e3ac06faf9f2eb90614e0e8f4bdf8f5e025da657cb8f85839cf494d8\u002Fmain.jpg\"},\"agencyProfileUrl\":\"https:\u002F\u002Fwww.realestate.com.au\u002Fagency\u002Fray-white-lower-north-shore-group-ABCMOS\"},\"agentReelVideo\":null,\"awards\":\"2025\u002F2026 - Premier Performer\\n2024\u002F2025 - Elite Performer\\n2023\u002F2024 - Elite Performer\\n2022\u002F2023 - Premier Performer\\n2021\u002F2022 - Elite Performer\\n2020\u002F2021 - Elite Performer\\n2019\u002F2020 - Elite Performer\\n2018\u002F2019 - Premier Performer\\n2017\u002F2018 - Premier Performer\",\"topAgentSuburbAward\":null,\"communityInvolvement\":\"At Ray White Lower North Shore Group we believe that it is important to give back to the local community. We are regularly involved in a number of charitable events such as the annual 20\u002FTwenty Challenge in support of children with cerebral palsy. We also provide ongoing support and donations to Cystic Fibrosis Australia. In addition, we have been the proud sponsors of Mosman Junior Rugby – the largest junior rugby club in NSW – for over 25 years. The local community is close to our hearts and supporting it is one of our passions.\",\"coverPhoto\":{\"uri\":\"\u002F0559ffb52730fab971932a03889ada4b96d30672d21489a760d7c6e20fdababb\u002Fmain.jpg\",\"templatedUrl\":\"https:\u002F\u002Fi1.au.reastatic.net\u002F{size}\u002F0559ffb52730fab971932a03889ada4b96d30672d21489a760d7c6e20fdababb\u002Fmain.jpg\"},\"description\":\"With more than 15 years of real estate experience, Chris Girling is recognised as one of the Lower North Shore's leading agents. Over the past decade with Ray White Lower North Shore, he has built a reputation as a trusted advisor, consistently delivering outstanding results for his clients. Known for his in-depth market knowledge, genuine client care and unwavering commitment to achieving the best possible outcomes, Chris has earned the trust of buyers and sellers across Sydney's Lower North Shore.\\n\\nSpecialising in Cremorne, Neutral Bay, Mosman and the surrounding Lower North Shore, Chris combines strategic thinking with honest advice and skilled negotiation. His background in business and accounting provides clients with a strong financial perspective, while his approachable nature ensures every transaction is handled with professionalism, transparency and care.\\n\\nHaving sold over 600 properties, he leads a team of four who all work hard to give clients the best possible experience and maximise their selling price. Chris believes that buying or selling property is one of life's most significant decisions and is passionate about making the process as smooth and rewarding as possible. He treats every client as he would his own family, taking the time to understand their goals and tailoring a strategy to suit their individual circumstances.\\n\\nA consistent Ray White Elite and Premier Performer, Chris's results reflect not only his dedication to excellence but also the trust and long-term relationships he has built with his clients. Known for his integrity, clear communication and relentless work ethic, he is committed to delivering an outstanding experience from the first conversation through to settlement.\\n\\nOriginally from England, Chris has proudly called Australia home for more than three decades. Outside of real estate, he enjoys spending time with his wife, Margaret, and their family, whether it's at a local café, park, or one of the Lower North Shore's beautiful beaches. His passion for the local community, combined with extensive market expertise, makes Chris a valued partner for anyone looking to buy or sell property in the area.\\n\\nI treat all clients as I would my own family.\\n\\nOn the weekend, you will find me at a local cafe, park or beach with my fami  high-performing group of five, consistently delivering outstanding results.\\nA Ray White Premier Member since 2019, Jake is the only dedicated apartment specialist in the Lower North Shore, giving him a strategic edge in a competitive market. His auction campaigns consistently generate strong competition, driving premium results with an impressive 85% clearance rate and an average of 20 days on market. His expertise in negotiation, buyer database management, and strategic marketing ensures no opportunity is missed.\\n\\nBeyond real estate, Jake is a devoted family man, engaged to his partner and a proud father of two—a baby boy and a newly born baby girl. Growing up in a family immersed in property, he developed a natural passion for the industry from an early age. When he’s not negotiating record sales, he enjoys spending time with his family, watching films, and following his beloved Dragons, hoping for the day they reclaim their former glory.\\n\\nWith a track record of success and a passion for property, Jake Wilson doesn’t just sell apartments—he sets new benchmarks in the industry.\",\"friendlyName\":\"Jake\",\"inclusions\":[\"profileBrandedEnquiryContactCard\",\"searchAgentLatestReview\",\"searchAgentReelVideo\",\"profileBrandedReviewsCard\",\"profileAgentExtendedContactSheet\",\"reviewsGoogleBusinessSyndication\",\"agentReelVideo\",\"profileAgentOnlyContactCard\",\"profileAboutAgentVideoAndAppraisalButton\",\"searchAgentAgencyBranding\",\"profileAgentAgencyBrandingStrap\",\"profileAgentAboutAppraisalCard\"],\"jobTitle\":\"Senior Sales Advisor | Strata Specialist | Licensed Real Estate Agent\",\"listings\":{\"salesBreakdown\":{\"apartment\":{\"count\":44,\"medianDaysOnSite\":28,\"medianSoldPrice\":1135000},\"house\":{\"count\":0,\"medianDaysOnSite\":null,\"medianSoldPrice\":null},\"townhouse\":{\"count\":0,\"medianDaysOnSite\":null,\"medianSoldPrice\":null}},\"stats\":{\"medianLeasedPrice\":null,\"medianSoldDaysOnSite\":28,\"medianSoldPrice\":1145000,\"sumL erience for both clients and agents. His commitment to excellence and continuous improvement drives him to push boundaries and deliver exceptional outcomes in every transaction. Operating across Sydney's Lower North Shore, Stefon has built an intimate understanding of the region's diverse property markets and unique character. His deep local knowledge combined with sophisticated market intelligence positions him as the strategic advisor of choice for sellers and buyers throughout the area.\\n\\nPerformance That Matters\\nWith over two decades in real estate, Stefon's career is defined by exceptional outcomes and industry leadership. He founded his first agency at 21, leading it to acquisition by a major franchise within five years. Consistently ranked among Australia's top agents, Stefon has built his reputation on delivering premium results across all property types and price points.\\n\\nHis success is measured not just in sales figures, but in the trust placed in him by vendors who return time and again. Stefon's commitment to his clients is absolute -every campaign is underpinned by meticulous preparation, strategic market positioning, and unwavering dedication to achieving the best possible outcome. His ability to navigate complex transactions with skill and finesse has earned him numerous accolades while establishing long-term relationships built on transparency and exceptional service\\n\\nStefon's Approach\\nWhether in Mosman, Cremorne, Neutral Bay, or across the broader Lower North Shore, Stefon combines professionalism with a unique, client-centric methodology that prioritises open communication and innovative strategies. His exceptional negotiating skills and energetic approach have transformed the sales process for thousands of clients, earning him numerous accolades and recognition in the industry. From strategic pricing and targeted buyer engagement to campaign execution and settlement coordination, every detail is managed with precision and care. Furt

2F\u002Fwww.realestate.com.au\u002Fbuy\u002Fproperty-house-with-3-bedrooms-in-mosman%2c+nsw+2088\u002Flist-1?numBaths=2&numParkingSpaces=2\\\",\\\"__typename\\\":\\\"PrettyUrl\\\"},\\\"metadata\\\":{\\\"canonicalSearchId\\\":\\\"WjCTpl7WIzBLwZKAGHMAWW1UudFWyoYRkex6jF8+o3w=\\\",\\\"savedSearchQuery\\\":\\\"{\\\\\\\"channel\\\\\\\":\\\\\\\"buy\\\\\\\",\\\\\\\"page\\\\\\\":1,\\\\\\\"pageSize\\\\\\\":25,\\\\\\\"localities\\\\\\\":[{\\\\\\\"searchLocation\\\\\\\":\\\\\\\"Mosman, NSW 2088\\\\\\\"}],\\\\\\\"filters\\\\\\\":{\\\\\\\"ex-under-contract\\\\\\\":false,\\\\\\\"excludeAuctions\\\\\\\":false,\\\\\\\"excludeNoDisplayPrice\\\\\\\":false,\\\\\\\"excludePrivateSales\\\\\\\":false,\\\\\\\"hasScheduledAuction\\\\\\\":false,\\\\\\\"excludeProjects\\\\\\\":false,\\\\\\\"propertyTypes\\\\\\\":[\\\\\\\"house\\\\\\\"],\\\\\\\"listerIds\\\\\\\":[],\\\\\\\"agencyIds\\\\\\\":[],\\\\\\\"bedroomsRange\\\\\\\":{\\\\\\\"minimum\\\\\\\":\\\\\\\"3\\\\\\\"},\\\\\\\"minimumCars\\\\\\\":2,\\\\\\\"minimumBathroom\\\\\\\":2,\\\\\\\"surroundingSuburbs\\\\\\\":true,\\\\\\\"excludeAddressHidden\\\\\\\":false,\\\\\\\"listingCategoryGroup\\\\\\\":[]}}\\\",\\\"__typename\\\":\\\"SearchMetadata\\\"}},\\\"results\\\":{\\\"__typename\\\":\\\"BuySearchResults\\\",\\\"totalResultsCount\\\":118,\\\"pagination\\\":{\\\"moreResultsAvailable\\\":true,\\\"__typename\\\":\\\"Pagination\\\",\\\"maxPageNumberAvailable\\\":5,\\\"page\\\":1},\\\"exact\\\":{\\\"items\\\":[{\\\"listing\\\":{\\\"__typename\\\":\\\"BuyResidentialListing\\\",\\\"id\\\":\\\"152216904\\\",\\\"description\\\":\\\"Opportunities of this scale have only presented themselves a handful of times across the Lower North Shore in the past decade. Set on 2,668sqm with expansive harbour views and a landmark c1903 residence, this is a true estate - the kind of landholding, position and scale that simply cannot be recreated.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EPositioned at the quiet southern end of Buena Vista Avenue, the home is deliberately oriented towards the harbour rather than the street, capturing sweeping 180-degree panoramas across Taylors Bay towards Rose Bay, Shark Island and the ocean horizon.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EEstablished bushland borders the southern boundary, creating a green and uninterrupted outlook, while the northerly aspect draws sunlight across the lawns, gardens and terraces throughout the day. The sense of privacy is exceptional, with the scale of the block allowing the residence to sit comfortably within its surrounds rather than dominate them.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EInside, the proportions are generous and beautifully suited to family living. Formal living and dining rooms sit either side of a wide central foyer, while an expansive 10-metre family room and stone-finished Miele kitchen open seamlessly to the sweeping curved terrace, pool and gardens beyond.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ESix bedrooms are arranged across two levels, including a substantial main suite with its own harbour-view balcony. A ground-floor bedroom provides flexibility for guests, extended family or multi-generational living.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThe lower level adds another layer to the home's entertaining credentials, with a wine cellar and pool cabana, while the upper balconies capture the harbour from multiple aspects.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EBeyond the gates, a sweeping driveway reinforces the sense of arrival, leading to a double lock-up garage with additional off-street parking for three vehicles.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EA genuine Lower North Shore estate of extraordinary rarity - combining a landmark residence, 2,668sqm of land and expansive harbour views in one of Mosman's most tightly held settings.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E• Level 2,668sqm north-facing landholding in one of Mosman's most tightly held pockets\u003Cbr\u002F\u003E• Expansive 180-degree harbour panoramas across Taylors Bay towards Rose Bay, Shark Island and the ocean horizon\u003Cbr\u002F\u003E• Landmark c1903 residence positioned to maximise the harbour outlook\u003Cbr\u002F\u003E• Established bushland along the southern boundary providing privacy and an uninterrupted green outlook\u003Cbr\u002F\u003E• Six bedrooms across two levels, including a main suite with private harbour-view balcony\u003Cbr\u002F\u003E• Formal living and dining rooms plus an expansive 10-metre family room\u003Cbr\u002F\u003E• Stone-finished kitchen with Miele appliances opening directly to the terrace\u003Cbr\u002F\u003E• Sweeping curved entertainer's terrace overlooking the pool, lawns and harbour\u003Cbr\u002F\u003E• Wine cellar and pool cabana on the lower-ground level\u003Cbr\u002F\u003E• Sandstone foundations, soaring ceilings and ducted air conditioning\u003Cbr\u002F\u003E• Double lock-up garage plus off-street parking for a further three vehicles\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EArtist’s impressions and concept plans have been prepared by Hampton Architecture for illustrative purposes only. They are not approved plans and do not form part of the sale. Any future development is subject to council and other approvals, which may not be granted, and the final design may differ. Interested parties should obtain their own planning advice.\u003Cbr\u002F\u003E\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fef6ac56c34bf97050b475edb963a58651da0e12cd19c7af3d274e290d380d8cb\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"images\\\":[{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fef6ac56c34bf97050b475edb963a58651da0e12cd19c7af3d274e290d380d8cb\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F29cd7ec8278ca7787a970d0a471872fdb20e8544156459829d583e5b5517a1d4\u002Fimage.jpg\\\"},{\\\"__typ Viewer\\\":false,\\\"__typename\\\":\\\"Lister\\\"}]},\\\"__typename\\\":\\\"BuySearchResultsItem\\\"},{\\\"listing\\\":{\\\"__typename\\\":\\\"BuyResidentialListing\\\",\\\"id\\\":\\\"150522072\\\",\\\"description\\\":\\\"Tucked away in a leafy Beauty Point cul-de-sac, this substantial family residence showcases the distinctive character of the charming 'P&O-inspired architecture' with Art Deco influences are reflected in rendered finishes, graceful curves, steel-framed staircase railings and generous proportions. Spanning three impressive levels, the versatile floor plan provides an abundance of space and flexible living options ideally suited to growing or established families. Large picture windows invite natural light throughout, while the peaceful terraced rear garden provides a private retreat with filtered water glimpses across to The Spit and surrounding waterways.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThe entry level offers a choice of formal and informal living spaces, with the open-plan rear of the home extending seamlessly to a generous alfresco entertaining terrace framed by established gardens and a tranquil pond. Upstairs, the flexible accommodation includes four bedrooms, with additional spaces easily adapted as a study, music room, nursery or dedicated home office. Adding further versatility is a self-contained garden apartment with its own private entrance, ideal as a teenage retreat, guest or in-law accommodation, or a separate space for those working from home.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EPositioned within a tightly held pocket of Mosman, this sought-after location combines a welcoming community atmosphere with exceptional lifestyle convenience. Families will appreciate access to a highly regarded local primary school, harbourside parklands and playing fields, while nearby transport provides easy connections to the city, surrounding suburbs and the Northern Beaches. Just moments from The Spit, Middle Harbour Yacht Club and the vibrant villages of Mosman and Seaforth, it's an ideal setting to settle in, enjoy and grow.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E- Enviable harbourside Pearl Bay\u002FBeauty Point locale\u003Cbr\u002F\u003E- Positioned on the high side of a private cul-de-sac\u003Cbr\u002F\u003E- Established verdant front and terraced rear gardens\u003Cbr\u002F\u003E- Three levels of living with garage + 4 car o\u002Fs parking\u003Cbr\u002F\u003E- Entrance vestibule with elegant staircase to upper level\u003Cbr\u002F\u003E- Formal living area spills out to a patio with leafy outlook\u003Cbr\u002F\u003E- Timber floorboards, built-in bespoke joinery, gas fireplace\u003Cbr\u002F\u003E- The formal dining has an elegant 'bay-style' sitting nook \u003Cbr\u002F\u003E- Gas cooking kitchen with s\u002Fs Euro appliances & d\u002Fwasher\u003Cbr\u002F\u003E- Convenient breakfast bar and separate butlers pantry\u003Cbr\u002F\u003E- Separate internal laundry room with shower facility\u003Cbr\u002F\u003E- Large open plan informal living flows to alfresco patio\u003Cbr\u002F\u003E- Established rear garden, gas bbq area, tranquil fish pond\u003Cbr\u002F\u003E- All bedrooms appointed with built-in robes and ceiling fans\u003Cbr\u002F\u003E- Master bedroom opens to elegant balcony perfect for reading\u003Cbr\u002F\u003E- Flexible floor plan presents options for use incl. home office\u003Cbr\u002F\u003E- Family bathroom with separate f\u002Fsize tub and shower\u003Cbr\u002F\u003E- Separate w\u002Fc on both levels, abundant storage options\u003Cbr\u002F\u003E- Lockup garage plus off-street parking for four vehicles\u003Cbr\u002F\u003E- Walk to harbourside parklands and recreation facilities\u003Cbr\u002F\u003E- Catchment for highly desirable Beauty Point School\u003Cbr\u002F\u003E- Moments to local, north and city-bound bus connections \u003Cbr\u002F\u003E- Easy access to Mosman and Seaforth shopping villages\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EOPEN TIMES DISPLAYED ON WEBSITE : www.croll.com.au or to ar e address, the home is ideally positioned on the doorstep to CBD and Manly-bound transport, moments from exclusive schools and Mosman Village shopping, and within easy walking distance of the beautiful Chinamans Beach, Parriwi Park, Spit Marina and popular harbourside restaurants.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E- Five bedrooms, four bathrooms, double garage and additional parking for two cars\u003Cbr\u002F\u003E- Charming three-storey Art Deco home positioned on a deep 645sqm (approx) block of land\u003Cbr\u002F\u003E- Ready to move in and enjoy with excellent scope to further enhance or modernise\u003Cbr\u002F\u003E- Adorned with soaring period detailed ceilings and stained glass windows\u003Cbr\u002F\u003E- Wonderfully flowing floor plan captures a selection of spacious living and dining areas\u003Cbr\u002F\u003E- Sunny east balcony with ocean views, ground level terrace, swimming pool, level lawns\u003Cbr\u002F\u003E- Master bedroom enjoys private balcony with sweeping views, built in and walk in robes\u003Cbr\u002F\u003E- Double bedrooms with built in robes, well presented bathrooms with showers\u003Cbr\u002F\u003E- Stylish stone kitchen equipped with gas cooking and quality Gaggenau appliances\u003Cbr\u002F\u003E- Lockup garage with storage space, carport, gated driveway and intercom entry\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EContact Michael Bao on 0431 818 528 or Jonathon De Brennan on 0431 807 583 for further details.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EDisclaimer: All information regarding this property, including but not limited to the general property description, price and the address, is gathered from sources we consider to be reliable, however we cannot guarantee its accuracy or give any warranty to the information provided. The information contained herewith should not be relied upon and you should make your own enquiries and seek advice in respect of this property.\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002 s across Balmoral to The Heads while offering a rare blend of immediate lifestyle appeal and long-term development opportunity. In the last street within the newly introduced LMR zoning boundary, the property presents a compelling prospect for buyers seeking a sophisticated turnkey home today with the flexibility to capitalise on future redevelopment potential. Elevated to maximise light, privacy and outlook, the wide harbour panorama benefits from its strategic position at the edge of the zoning transition, where the boundary limits further large-scale development beyond this point. As a result, the outlook is widely considered protected, reinforcing the property's enduring appeal. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EArchitect-designed and finished with a refined European sensibility, the residence unfolds across a thoughtfully planned family layout defined by generous proportions, warm natural materials and seamless indoor\u002Foutdoor connection. A substantial stone kitchen is appointed with premium Miele appliances including induction and gas cooking, while multiple living spaces provide flexibility for families, including a separate casual zone that connects to the home's peaceful rear garden. Inspired by Japanese design principles, this private outdoor retreat offers a calm and contemplative counterpoint to the expansive harbour outlook. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EAccommodation is equally generous, with a harbour-view balcony to the master retreat, three additional oversized bedrooms and further study or workspace options. Beyond its lifestyle credentials, the property holds significant future potential, with scope for duplex redevelopment or reconfiguration (STCA), appealing to buyers seeking both land value and long-term flexibility in a tightly held Balmoral slopes enclave. With Balmoral Beach, its celebrated cafés and waterfront dining just a short stroll away, the home combines architectural quality, breathtaking outlooks and strategic positioning in one of Mosman's most coveted coastal pockets.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E* Elevated Balmoral position with harbour views\u003Cbr\u002F\u003E* Wide outlook across Balmoral to The Heads\u003Cbr\u002F\u003E* Last street within new LMR zoning boundary\u003Cbr\u002F\u003E* Future duplex\u002Fredevelopment potential STCA\u003Cbr\u002F\u003E* Architect-designed, quality European finishes\u003Cbr\u002F\u003E* Expansive formal lounge and dining zones\u003Cbr\u002F\u003E* French doors to the harbour-view balcony\u003Cbr\u002F\u003E* Stone island kitchen, Miele fitout, prep sink\u003Cbr\u002F\u003E* Electric highlight windows, blackbutt flooring\u003Cbr\u002F\u003E* Separate casual living and dining zones\u003Cbr\u002F\u003E* Upper-level master with ensuite and robes\u003Cbr\u002F\u003E* Master balcony with sweeping water outlook\u003Cbr\u002F\u003E* Private home office + flexible workspace options\u003Cbr\u002F\u003E* Japanese-inspired private garden, ducted A\u002FC\u003Cbr\u002F\u003E* Extensive storage, cellar and equipment rooms\u003Cbr\u002F\u003E* B2B alarm, sound, C-Bus lights and smart tech\u003Cbr\u002F\u003E* Internal access to the double lock-up garage\u003Cbr\u002F\u003E* Short walk to Balmoral Beach, cafés, village life\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fde97210b4cbf6fb2909b9cb4ce1ac29addd270d5aa49a028f697f4b9fbd4094e\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"images\\\":[{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fde97210b4cbf6fb2909b9cb4ce1ac29addd270d5aa49a028f697f4b9fbd4094e\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fb4cb82ce1c8b169df196731652443cea950f635b95dd825ae5a3d294707fc9d9\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"htt lly tranquil setting. Level access extends from the street through the home and directly to the rear garden, pool and entertaining areas. Built to an impressive 7-star energy rating, the residence showcases premium materials and considered detailing, including oversized doors and grand vaulted entry spaces. Original sandstone from the property's 1920s residence has been thoughtfully retained within the front fence and electric driveway gate, creating a unique connection to its history.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EApproximately 440sqm of internal accommodation and entertaining provides generous proportions, with three living areas and five \u002F six bedrooms. The huge gourmet kitchen features a gas cooktop, built-in refrigeration, two dishwashers and a microwave, twin electric ovens and a substantial butler's kitchen with wine fridge. Expansive sliding glass doors open to the large, covered terrace, level rear lawns, gardens, heated pool and outdoor entertaining areas. The gardens are designed by renowned landscape designer Barbara Lansberg, creating a private resort-like setting with lush planting, established greenery and multiple spaces to relax and entertain. The heated pool is complemented by a 4m x 10.2m covered alfresco area with the outdoor kitchen, while at the end of the garden a secluded firepit area with built-in seating provides a beautiful setting day and night.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThe residence has excellent natural light, with northern sun to the front bedrooms and living areas and sunshine across the rear garden and pool. The oversized main bedroom enjoys sweeping views towards Sydney CBD and includes an impressive ensuite with a generous dressing room. Additional features include zoned air conditioning, EV charging port, a commercial-sized gas fireplace, extensive storage, a large family laundry and internal access from the double garage. There is also room for 1 or 2 more cars off the street in the driveway\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThe property is 600m from Chinamans Beach and about 1km down to Middle Harbour, the Spit Marinas and waterfront dining. Mosman Village and Balmoral Beach are a 6-minute drive away. Middle Harbour Public School is on Medusa Street and there are regular bus services on the street to provide convenient access to North Sydney and the Sydney CBD. The Scots College Eastern Suburbs school bus also has a stop on the street providing easy access to Eastern Suburbs private schools. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EAn exceptional opportunity to secure a brand-new family residence on a substantial landholding in one of Mosman's most desirable locations.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EPrice Guide: $9,000,000 - $9,500,000\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EInspect: Sat\u002FWed 1.00pm to 1.40pm or by appointment\u003Cbr\u002F\u003EAuction: 5.00pm, Wednesday 11th November \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EContact Agents: \u003Cbr\u002F\u003EJason Guildea 0411 859 505 \u003Cbr\u002F\u003EAimee Welch 0401 422 554 \u003Cbr\u002F\u003ELisa Wenban 0423 880 016\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E*Agent Interest*\u003Cbr\u002F\u003E\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fbfb65261411893fa38d51bc2a76634144157ee8894c02005fd3a6860aabd65cf\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"images\\\":[{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fbfb65261411893fa38d51bc2a76634144157ee8894c02005fd3a6860aabd65cf\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fe27839e5eb58ffbbd7db39e83c5ee677715d134f64892fb6faea6fddcb0cd7b3\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F462f923e84289c7dd9361da261533c4988954fc472d0d1fc4 \"__typename\\\":\\\"ListerLinks\\\"},\\\"showInMediaViewer\\\":false,\\\"__typename\\\":\\\"Lister\\\"}]},\\\"__typename\\\":\\\"BuySearchResultsItem\\\"},{\\\"listing\\\":{\\\"__typename\\\":\\\"BuyResidentialListing\\\",\\\"id\\\":\\\"152791832\\\",\\\"description\\\":\\\"Set behind the gates of the coveted Tregoyd Estate on Balmoral Slopes, this freestanding Torrens Title home pairs timeless Hamptons-inspired interiors with a lush, private setting. Light-filled, beautifully finished and wrapped in tropical greenery, it offers a relaxed family lifestyle with exclusive access to a swimming pool and tennis\u002Fpickleball court. The secure, low-maintenance gated community also brings genuine lock-up-and-leave convenience, ideal for those who travel often or would rather spend their time enjoying life than maintaining a home. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThe ground floor centres on an open-plan family, living and dining zone anchored by a stone fireplace and warm timber floors. Glass doors open to a private north-facing courtyard of travertine paving, manicured gardens and a tranquil water feature, framed by a canopy of towering palms. A separate formal living room with media nook gives everyone their own space.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThe kitchen is a true centrepiece, featuring duck egg blue Shaker-style cabinetry, an oversized stone island with seating for four, Perrin & Rowe tapware and a pot filler, handmade-look subway tiles, and a butler's pantry with an integrated laundry.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EUpstairs, the master retreat opens to a private balcony overlooking the treetops, complete with a walk-in robe and an ensuite with a freestanding bath and double vanity with heated floors and towel rails. Three further bedrooms include one with its own ensuite and another with a balcony, joined by a dual-desk study and a family bathroom.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EPositioned within one of Mosman's most private gated enclaves, the home sits close to the shops, cafess and restaurants of Mosman Village, with the sand and harbour waters of Balmoral Beach also nearby. Local schools, parks and city-bound transport are all within easy reach.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E•\\\\tFour bedrooms plus study, two ensuites, main bathroom all with heated towel rails and guest WC\u003Cbr\u002F\u003E•\\\\tOpen-plan family\u002Fliving\u002Fdining with fireplace, separate formal living\u003Cbr\u002F\u003E•\\\\tFormal living with built-in media unit and French doors to the terrace\u003Cbr\u002F\u003E•\\\\tShaker-style kitchen with island, Perrin & Rowe fittings, a Wolf oven and butler's pantry\u002Flaundry\u003Cbr\u002F\u003E•\\\\tProfessional-style cooktop, brass pendant lighting and a garden outlook from the sink\u003Cbr\u002F\u003E•\\\\tMaster suite with walk-in robe, balcony and ensuite\u003Cbr\u002F\u003E•\\\\tBuilt-in robes to all secondary bedrooms, second bedroom with its own balcony\u003Cbr\u002F\u003E•\\\\tDual-desk study, ideal for working from home \u003Cbr\u002F\u003E•\\\\tPrivate landscaped courtyard and terraces with water feature and pond\u003Cbr\u002F\u003E•\\\\tMultiple alfresco dining spots surrounded by established tropical gardens\u003Cbr\u002F\u003E•\\\\tDucted air conditioning and timber floors \u003Cbr\u002F\u003E•\\\\tVideo intercom, linen cupboard and under-stair storage\u003Cbr\u002F\u003E•\\\\tDouble lock-up garage with internal access and storage, off-street and guest parking available \u003Cbr\u002F\u003E•\\\\tEstate facilities include pool, tennis court and a rainforest walkway\u003Cbr\u002F\u003E•\\\\tApprox. 247sqm internal, 338sqm total including terraces and garage\u003Cbr\u002F\u003E•\\\\tApprox. 200m to Mosman Village\u003Cbr\u002F\u003E•\\\\tApprox. 700m to Balmoral Beach\u003Cbr\u002F\u003E•\\\\tApprox. 280m to nearest bus stop\u003Cbr\u002F\u003E•\\\\tApprox. 1km to Mosman Public School and Mosman High School\u003Cbr\u002F\u003E\u003Cbr\u002F\u003 or the first time in over 100 years, having been tightly held by the same family for three generations.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EOffering exceptional potential, this distinguished residence is ready to be restored to its former grandeur and transformed into a magnificent family home in one of Mosman's most prestigious harbourside settings.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E'Kooringal' presents graceful period features including high ornate moulded ceilings, architectural frames and curves, panelled doors, leadlight windows, wide skirts, sash windows, picture rails and fireplaces. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EMostly in original condition, it has benefited from a second-storey addition in the early '80s, including a spacious open-plan living or family\u002Frumpus space with breathtaking views, a practical kitchenette, bathroom, and ample storage. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EBoasting a commanding street presence, the property occupies a substantial corner allotment on a quiet one-way street, with dual access from Arbutus Street and adjoining Evans Lane.  Kooringal enjoys breathtaking harbour views across Clontarf and Grotto Point to Manly, North Head and beyond. The enviable position is just moments from the iconic sands of Balmoral Beach, the Esplanade, local highly desirable private and public schools and to Mosman Village and Junction shopping precincts.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ERich in character and heritage, this distinguished residence presents exceptional scope to introduce contemporary comforts while preserving the architectural charm and elegance of its original design. A remarkable piece of Mosman's history, the property holds immense potential to be transformed into a grand and sophisticated family home for generations to come.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EARCHITECTURAL FEATURES :\u003Cbr\u002F\u003E- Built in 1902 and presenting charming original character\u003Cbr\u002F\u003E- Freestanding dwelling with side paths to rear of lot\u003Cbr\u002F\u003E- Front & rear established and enclosed lawn & gardens\u003Cbr\u002F\u003E- East-west orientation provides all-day sunshine\u003Cbr\u002F\u003E- Elevated position invites gentle harbour breezes\u003Cbr\u002F\u003E- Welcoming sandstone entrance, tessellated tile feature\u003Cbr\u002F\u003E- Two levels of living, grand proportions, 3.3m ceilings\u003Cbr\u002F\u003E- Wide entrance vestibule\u002Ffoyer off covered portico\u003Cbr\u002F\u003E- Flexible floorplan with substantial-sized rooms t\u002Fout\u003Cbr\u002F\u003E- Abundant natural light due to extensive use of glazing\u003Cbr\u002F\u003E- Both formal and informal living and dining  spaces\u003Cbr\u002F\u003E- Stunning original fireplaces in lounge and dining \u003Cbr\u002F\u003E- Separate covered veranda\u002Fsunroom\u002Freading room\u003Cbr\u002F\u003E- Original kitchen with pantry and abundant storage\u003Cbr\u002F\u003E- Four well-sized bedrooms, master with bay window\u003Cbr\u002F\u003E- Upper-level retreat with kitchenette and bathroom\u003Cbr\u002F\u003E- Bathrooms on upper and lower level, plus sep W\u002FC\u003Cbr\u002F\u003E- Large family-sized laundry opens directly to rear\u003Cbr\u002F\u003E- Extensive interior storage options on both levels\u003Cbr\u002F\u003E- Large under-house storage potential for wine cellar\u003Cbr\u002F\u003E- Covered outdoor alfresco patio off casual living space\u003Cbr\u002F\u003E- Rear lawned, enclosed yard with opportunity to update\u003Cbr\u002F\u003E- 2+ car lock-up garage plus u\u002Fc carport for 2 cars\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EEnjoying an enviable position in one of Mosman's most prestigious harbourside enclaves, 'Kooringal' is exceptionally well placed to enjoy the very best of the local lifestyle. Just moments from the iconic shores of Balmoral Beach, beautiful parklands and sporting fields, the home is also conveniently located close to leading schools including Queenwood, Mosman Public School and Mosman High School. The vibrant shopping and dining precincts of Mosman Village and Junction, together with excellent local amenities and transport connections, further enhance the appeal of this outstanding family address.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ETransport\u003Cbr\u002F\u003E- Bus services to northern suburbs and northern beaches\u003Cbr\u002F\u003E- Bus routes to North Sydney & Victoria Cross Metro\u003Cbr\u002F\u003E- Express CBD service to Sydney's central business district\u003Cbr\u002F\u003E- Mosman Bay & Taronga ferry connections to Circular Quay\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ELocal schools\u003Cbr\u002F\u003E- Queenwood Ladies School\u003Cbr\u002F\u003E- Queenwood Art & Design Campus\u003Cbr\u002F\u003E- Mosman Public & Mosman High School\u003Cbr\u002F\u003E- Mosman Church of England Preparatory School\u003Cbr\u002F\u003E- SCECGS School\u003Cbr\u002F\u003E- Sacred Heart Catholic Primary School\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ESporting & Community Facilities\u003Cbr\u002F\u003E- Balmoral Baths\u003Cbr\u002F\u003E- Balmoral Club\u003Cbr\u002F\u003E- Balmoral Sailing Club\u003Cbr\u002F\u003E- Balmoral, Rawson & Alan Border Ovals\u003Cbr\u002F\u003E- Balmoral & Edwards Beach\u003Cbr\u002F\u003E- The Esplanade\u003Cbr\u002F\u003E- Mosman Library and Community Centre\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EShopping\u003Cbr\u002F\u003E- Mosman Village and Junction\u003Cbr\u002F\u003E- Bridgepoint Centre\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EAll information contained herein is gathered from sources we believe to be reliable. However, we cannot guarantee its accuracy, and interested persons should rely on their own enquiries.\u003Cbr\u002F\u003E\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F7c7527ec8cdbc1560992dc0832ff5b800eb553be600cb19abafa01155b871936\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"images\\\":[{\\\"__typename\\\":\\\"Image\\\",\\\"tem ost prestigious schools. With the Mosman Bay Ferry also just a short stroll away, effortless city commutes and harbour living are yours to enjoy.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E• Elegant Federation home with original character detail\u003Cbr\u002F\u003E• Sweeping timber staircase and rich herringbone parquetry flooring throughout\u003Cbr\u002F\u003E• Open plan living and dining opening via bi-fold doors to a covered alfresco terrace\u003Cbr\u002F\u003E• Outdoor stone fireplace creating a year round entertaining space\u003Cbr\u002F\u003E• Sparkling frameless glass fenced pool and spa set amid lush, private hedged gardens, complete with hot and cold outdoor shower\u003Cbr\u002F\u003E• Sleek stone benchtop kitchen with quality stainless steel appliances, Zip tap and ample storage\u003Cbr\u002F\u003E• Generous bedrooms, including a luxurious main with walk-in robe and ensuite\u003Cbr\u002F\u003E• Beautifully finished marble and stone bathrooms with frameless glass showers\u003Cbr\u002F\u003E• CCTV security system with convenient remote access; ducted air-conditioning\u003Cbr\u002F\u003E• Moments to Spofforth Street cafés, Mosman Village, top schools and the Mosman Bay Ferry\u003Cbr\u002F\u003E\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F49d3d431b1ede33f50f5ad0518e6652613b5892529225047f238a60a6a0a55aa\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"images\\\":[{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F49d3d431b1ede33f50f5ad0518e6652613b5892529225047f238a60a6a0a55aa\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F5563efbced864f26431ee04e475454eeb26c671d7c2859c02aa612a49df5e15f\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F9c2c74d78cfb87ba359  detail. Homage is paid to classic federation style exemplified by Art Deco inspired leadlight details in the front door, with custom solid sandstone steps descending to the entrance. From here, there's a clear line of sight through to the rear terrace, captivated by far-reaching views to the North Sydney skyline. Interiors reflect a curated palette of natural elements from hardwood timber floors to a selection of European marble finishes, elevating the original Californian bungalow design to a standard of unparalleled contemporary refinement. Impressive in scale, the layout provides a selection of living areas from formal lounge and dining, to open plan family living and entertaining, as well as a versatile gym. Alfresco entertaining overlooks an expansive level lawn and resort style pool amid Paul Bangay designed gardens. Upstairs, the palatial main bedroom suite opens to a balcony embracing city skyline views which encompass the Harbour Bridge. This property is nestled in a prized enclave between Sirius Cove Beach and Taronga Zoo.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EFamilies seeking a palatially scaled residence thoughtfully upgraded with luxurious finishes in a sought-after enclave. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003E• Casual living areas extend seamlessly via bi-fold doors to an expansive entertaining terrace with built-in barbecue kitchen\u003Cbr\u002F\u003E• Custom leadlight door details composed with English glass ensure rich street appeal, illuminated by Articolo light\u003Cbr\u002F\u003E• Facade accented by copper awnings and water features in precision landscaped surrounds\u003Cbr\u002F\u003E• Distinguished formal lounge and dining rooms featuring Fior di Bosco marble fireplace, high ceilings and skirting boards\u003Cbr\u002F\u003E• Monumental kitchen composed with Grigio Perlatto marble benchtops, American walnut crown cut veneer joinery\u003Cbr\u002F\u003E• Appliances include double Gaggenau ovens, Gaggenau induction cooktop and Subzero French door refrigeration\u003Cbr\u002F\u003E• In-ground pool and resort style surrounds punctuated by Tuucci umbrellas imported from Miami, garden features Spanish Bover lighting\u003Cbr\u002F\u003E• Lower level gym with adjoining bathroom provides incredible versatility of use\u003Cbr\u002F\u003E• Luxurious accommodation includes five bedrooms with built-ins including flexible fifth\u002Fstudy, and an entry level suite\u003Cbr\u002F\u003E• Main bedroom features dual walk-in wardrobes, separate air conditioning, city view terrace and a Calcutta Viola Monet marble ensuite\u003Cbr\u002F\u003E• All bathrooms finished with Italian Bottocino marble flooring and Astrawalker English brass tapware, the main with a Victoria+Albert bath tub and rainshower \u003Cbr\u002F\u003E• Four-car lock-up garage with epoxy gloss floors and internal access opens to rear lawn, adjacent store room\u003Cbr\u002F\u003E• Intercom system throughout all three levels, back-to-base alarm, zoned ducted air conditioning, Sonos sound system, wine cellar\u003Cbr\u002F\u003E• 350m to city buses, handy to Clifton Gardens, close to Queenwood and moments to the heart of Mosman village's shopping and dining options.\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F3702d50b04553c56fcc96a75b9bc4de4765a4e58bf97ee76a3e531496eea9874\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"images\\\":[{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F3702d50b04553c56fcc96a75b9bc4de4765a4e58bf97ee76a3e531496eea9874\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fda147ba31c84ac15991ad9f6bea41f6dc7063cedc73867d70afadc1e81a24298\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fa43864a30b7b1e8b161f03b276c33252d9d4bc043c1f3cb2 ad48087dd50c047ae1c827157f182601cd4510334b2d49459cc46c46d8554\u002Fmain.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"_links\\\":{\\\"canonical\\\":{\\\"href\\\":\\\"https:\u002F\u002Fwww.realestate.com.au\u002Fagent\u002Fandrew-thomas-2391074?cid={cid}\\\",\\\"__typename\\\":\\\"AbsoluteLinks\\\"},\\\"__typename\\\":\\\"ListerLinks\\\"},\\\"showInMediaViewer\\\":false,\\\"__typename\\\":\\\"Lister\\\"}]},\\\"__typename\\\":\\\"BuySearchResultsItem\\\"},{\\\"listing\\\":{\\\"__typename\\\":\\\"BuyResidentialListing\\\",\\\"id\\\":\\\"152633728\\\",\\\"description\\\":\\\"A commanding presence at the end of an exclusive Mosman cul-de-sac, this grand Federation home combines nostalgic detailing with timeless updates creating a private haven for large families with a perfect north to rear aspect.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ELandscaped to enhance the striking c1910 sandstone flagged facade, welcome guests in through the classic front porch and wide hallway, where soaring ceilings set the tone. Formal rooms and a selection of bedrooms elegantly retain original fireplaces, and stunning bay windows look out onto the gardens. Spilling out to open-plan living at the rear, the dining, family room and kitchen seamlessly combine for everyday functionality. Connecting to an expansive north facing terrace, the poolside outdoor entertaining is large enough to zone into alfresco dining and open-air lounging. Continually connecting inside and out, a wall of sliding windows in the shaker-style kitchen overlooks the barbecue terrace and enables you to watch kids playing upon the level lawns or within the sundrenched swimming pool. Wonderfully spacious, the kitchen is fitted with generous storage and benchtop space, a semi-integrated Smeg dishwasher, six burner gas cooktop and a 90cm under counter Fisher & Paykel oven.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EPresenting flexible accommodation options suited to growing or multi-generational families, there is a selection of relaxing bedroom retreats across both levels, the perfect vantage point for the New Year's Eve fireworks. There is the potential to convert multiple bedrooms into studies or extra living spaces. Serviced by four bathrooms, there is an ensuite off the majestic master bedroom and a dual access bathroom on the first floor. Impressive in every way, features of special appeal include a secure carport, a lockup garage, two extra off-street car spaces, subfloor cellaring, and ducted reverse cycle air conditioning.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ESet above Mosman Rowers privately basking in the natural beauty of its harbourside setting, stroll to Mosman Ferry Wharf, Old Cremorne Wharf and Cremorne Point Wharf via the nearby foreshore walking tracks. Picturesque yet incredibly convenient, local Spofforth Street shops are a 550-metre walk away and there is also easy access to leading schools and to city bus stops.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E•\\\\tMagnificent arched bay window in lounge room\u003Cbr\u002F\u003E•\\\\tFamily room and dining bathed in northern sun\u003Cbr\u002F\u003E•\\\\tSliding glass doors to terrace, retractable awning\u003Cbr\u002F\u003E•\\\\tGranite tops the timeless shaker kitchen joinery\u003Cbr\u002F\u003E•\\\\tSix burner gas cooktop and Fisher & Paykel oven\u003Cbr\u002F\u003E•\\\\tSmeg semi-integrated dishwasher, double sink\u003Cbr\u002F\u003E•\\\\tSkylit staircase, north facing balcony upstairs\u003Cbr\u002F\u003E•\\\\tHarbour and cityscape views from upper level\u003Cbr\u002F\u003E•\\\\tOrnate fireplaces in living rooms and bedrooms\u003Cbr\u002F\u003E•\\\\tSoaring ceilings\u003Cbr\u002F\u003E•\\\\tWalk-in robe and ensuite off the master bedroom\u003Cbr\u002F\u003E•\\\\tVersatile bedroom and accommodation options\u003Cbr\u002F\u003E•\\\\tBathtub and walk-in shower in primary bathroom\u003Cbr\u002F\u003E•\\\\tDual access bathroom upstairs, ample built-ins\u003Cbr\u002F\u003E•\\\\tCombined laundry room and fourth bathroom\u003Cbr\u002F\u003E•\\\\tHome office off elegant entry level bedroom\u003Cbr\u002F\u003E•\\\\tNatural rockery retained in landscaping design\u003Cbr\u002F\u003E•\\\\tHuge north facing concrete pool and sun decks\u003Cbr\u002F\u003E•\\\\tLockup garage, carport, two off-street spaces\u003Cbr\u002F\u003E•\\\\tLeadlight windows, classic pendants, ceiling roses\u003Cbr\u002F\u003E•\\\\tHigh skirting boards outline timber floorboards\u003Cbr\u002F\u003E•\\\\tDucted reverse cycle air-conditioning, three gas bayonets\u003Cbr\u002F\u003E•\\\\t100m to Mosman Rowers via Cremorne Point Walk\u003Cbr\u002F\u003E•\\\\t450m to local bus stop, 1km to IGA and cinema\u003Cbr\u002F\u003E•\\\\t550m to local Spofforth Street shops and eateries\u003Cbr\u002F\u003E•\\\\t550m to ferry wharf circling around Mosman Bay\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E*All information contained herein is gathered from sources we consider to be reliable. However we cannot guarantee its accuracy and interested persons should rely on their own enquiries.  \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EFor more information or to arrange an inspection, please contact Ross Nesdale 0452 030 872 or Leonard Van der Velde 0413 428 298.\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fbc9140eab341d3810df3c73fbcb1fc49117d64715f66d5ab6aebfa5692a5ea23\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"images\\\":[{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fbc9140eab341d3810df3c73fbcb1fc49117d64715f66d5ab6aebfa5692a5ea23\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fe2a729bb7d0c33a69acfaaef07b19ed18c369787d87f137a292be1b5e20e7adc\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F5986872823fbf5cc301fc495f5c977e69c8fb38f03faae0f5 Cbr\u002F\u003EOn the ground level, a four-metre ceiling and high windows on three sides lift the open living and dining, anchored by a fireplace set above solid marble. A hidden butler's pantry supports the kitchen, and a separate sitting room offers a quieter place to retreat. The living flows out to a covered outdoor room with a Wolf barbecue kitchen and an organic-shaped pool, finished in Spanish mosaics with a swim lane and a shallow play shelf for younger children.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EFive bedrooms are softened by layered, motorised curtains. Three marble-lined ensuites and a main bathroom have underfloor heating, a powder room serves guests, and a family retreat gives everyone room to spread out. Behind the finishes is everyday ease: zoned Daikin climate control, Casambi smart lighting and security, Sonos audio throughout and a 13.16kW solar system.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EDouble garaging with internal access completes the home, which sits within easy reach of The Esplanade, Georges Heights and Mosman village.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EKEY DETAILS: \u003Cbr\u002F\u003E•\\\\tNewly built by EMK Architects and Hammercorp, designed around curved, organic forms\u003Cbr\u002F\u003E•\\\\tViews toward Balmoral Beach and Middle Harbour, with a layout planned to capture northeast light\u003Cbr\u002F\u003E•\\\\t545sqm block with 407sqm total floor area across two levels\u003Cbr\u002F\u003E•\\\\tFour-metre living ceiling, sculptural staircase and circular skylights carrying light through the home\u003Cbr\u002F\u003E•\\\\tFive bedrooms, Calacatta Verde marble ensuites, main bathroom and powder room, plus family retreat\u003Cbr\u002F\u003E•\\\\tCalacatta Monet marble kitchen with V-Zug and Sub-Zero appliances and a hidden butler's pantry\u003Cbr\u002F\u003E•\\\\tMosaic-tiled pool with swim lane and children's play shelf, beside a covered Wolf outdoor kitchen\u003Cbr\u002F\u003E•\\\\tCasambi smart home, Occhio lighting, Sonos a  built-in French door Fisher & Paykel refrigerator. Re-designed to suit all stages of family life, the separate TV room is warmed by a Heat n Glo fireplace and opens out to the great outdoors. Entertain indoors or outdoors, Travertine paving creates year-round alfresco living spaces.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EPresenting four inviting bedrooms, the sophisticated master suite comprises of a walk-in robe and luxe ensuite with walk-in shower and double vanity. Both bathrooms are finished in premium heated tiles with subtle marble veining; the primary bathroom boasts a family friendly bathtub. Impressive in every way, other features of appeal include custom joinery, chic storage options, ducted and split system air conditioning plus a locked temperature controlled wine cellar with capacity for up to 1500 bottles. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EA DA approval is in place for a second-storey extension, incorporating two bedrooms, a bathroom, dedicated study and generous family living space, providing an exceptional opportunity to enhance the home's accommodation, functionality and long-term appeal.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ELocated above Reid Park and within easy reach of the scenic Cremorne Point Walk, stroll around the waterfront at your leisure to either Mosman Bay or Cremorne Point. Close to local cafes and speciality retail stores, Spofforth Street shops are less than 200 metres away with the attractions of Cremorne Junction and Military Road just a little further up the road. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003E•\\\\tWide oak floorboards in the hallway and living\u003Cbr\u002F\u003E•\\\\tEntertainer's island bench in renovated kitchen\u003Cbr\u002F\u003E•\\\\tStone benchtops and splashback, Miele dishwasher\u003Cbr\u002F\u003E•\\\\tIlve wall and combi ovens and inset gas cooktop\u003Cbr\u002F\u003E•\\\\tConcealed French door Fisher & Paykel fridge\u003Cbr\u002F\u003E•\\\\tDA approval for 2nd storey extension\u003Cbr\u002F\u003E•\ 03E•\\\\tElegant corbelled arch hallway, polished Kauri floorboards\u003Cbr\u002F\u003E•\\\\t4 bedrooms on one level, 3 large beds with built-in robes\u003Cbr\u002F\u003E•\\\\tBay fronted main bedroom, 3.3m pressed metal ceilings\u003Cbr\u002F\u003E•\\\\tFluid living and dining rooms anchored by a marble fireplace\u003Cbr\u002F\u003E•\\\\tCasual living with a fireplace, bright skylit island kitchen \u003Cbr\u002F\u003E•\\\\tAll-weather entertainer's terrace and a sunny level garden\u003Cbr\u002F\u003E•\\\\tVine-framed sun terrace and spa, huge garden storeroom\u003Cbr\u002F\u003E•\\\\t2 bathrooms, separate internal laundry, gas central heating\u003Cbr\u002F\u003E•\\\\tFamily friendly neighbourhood, 550m to Woolworths Metro\u003Cbr\u002F\u003E•\\\\tJust over 1km to Balmoral Beach, 350m to Mosman Prep School\u003Cbr\u002F\u003E\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F60e0a27a484d49d88a543f31b85f896e359d2a819a86ae121ed023a3338e767b\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"images\\\":[{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F60e0a27a484d49d88a543f31b85f896e359d2a819a86ae121ed023a3338e767b\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F5ca1e668ed7a498a369720aa90e155cecb09b817fc1f34d5815a3c52f11fd006\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F6cb056e0166c0f1d0fe42e1d34ed4f81d09a418908de0e3d9d6e78a5badecf7f\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fd953c2475cbda5a284f12a6d88c2e448739cc69b2197ceb2e90d46c6dbc25fd7\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F ending to its own private sunlit balcony. Its two balconies and paved poolside area offer perfect place for sunset drinks and watching Sydney's famous New Years Eve fireworks. Positioned just a two-minute walk to South Mosman Wharf, this graceful home's privileged setting, serene harbour outlook and rich historical appeal, create a truly memorable offering.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E- Exquisite Arts & Crafts home with period features and fixtures\u003Cbr\u002F\u003E- Breathtaking Mosman Bay, city and Harbour Bridge views\u003Cbr\u002F\u003E- Traditional layout with formal and informal living\u002Fdining\u003Cbr\u002F\u003E- Choice of two sunlit balconies, perfect NYE vantage points\u003Cbr\u002F\u003E- Original high ornate ceilings, polished timber floorboards\u003Cbr\u002F\u003E- Sleek stone kitchen w\u002F Miele cooktop & grill, dishwasher\u003Cbr\u002F\u003E- Four well-sized bedrooms, lower opens to sunny garden & pool\u003Cbr\u002F\u003E- Upper-level master opens to sun bathed view-swept balcony \u003Cbr\u002F\u003E- Master bedroom with high raked cathedral ceiling and ensuite\u003Cbr\u002F\u003E- Charming bathrooms with chequerboard black & white floors\u003Cbr\u002F\u003E- Exquisite original working fireplaces, split air conditioning\u003Cbr\u002F\u003E- Lovely established gardens and charming private back courtyard\u003Cbr\u002F\u003E- Heated saltwater pool with gazebo & stunning views of Mosman Bay\u003Cbr\u002F\u003E- Sandstone wine cellar and vast storage, external laundry with w\u002Fc\u003Cbr\u002F\u003E- Two-min walk to the ferry wharf and bus stop\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F438441b4cef787fa3883dd83f9eaf56eaac82d6f7d234961f6b1c8f04d08ea93\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"images\\\":[{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size ances and butler's pantry anchors the main level. Five bedrooms provide excellent flexibility, with four positioned on the upper level including a main suite with harbour and city views, walk in robe and ensuite, while a separate guest suite sits privately on the ground floor.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EEvery element has been carefully considered and resolved. Lift access across all levels, a home theatre, temperature controlled wine cellar, custom bar, integrated sound and security, and underfloor heating to all bathrooms.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EPositioned moments from Clifton Gardens, harbour foreshore walks and Mosman Village, this is a home that offers immediate ease, long term functionality and an outcome that would be challenging to recreate today.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EA sanctuary for families who seek a lifestyle of contemporary indoor\u002Foutdoor luxury\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E• Master Builders Association Award Winner 2023\u003Cbr\u002F\u003E• Full concrete slab and double brick construction\u003Cbr\u002F\u003E• Architectural design by Corben Architects, interiors by Coco Republic\u003Cbr\u002F\u003E• North facing garden with heated magnesium pool and outdoor kitchen\u003Cbr\u002F\u003E• Marble island kitchen with Miele appliances and butler's pantry\u003Cbr\u002F\u003E• Five bedrooms, main suite with walk in robe and ensuite\u003Cbr\u002F\u003E• Four marble bathrooms with underfloor heating\u003Cbr\u002F\u003E• Internal lift, home theatre, wine cellar and custom bar\u003Cbr\u002F\u003E• Temperature controlled wine cellar for 800 bottles\u003Cbr\u002F\u003E• Integrated sound, security and multi zone air conditioning\u003Cbr\u002F\u003E• Double garage plus gated off street parking\u003Cbr\u002F\u003E• Walk to Clifton Gardens, Mosman Village and city buses\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F369994ad03146fb6b02f8d8eec

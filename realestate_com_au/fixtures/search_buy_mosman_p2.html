iving and dining, anchored by a fireplace set above solid marble. A hidden butler's pantry supports the kitchen, and a separate sitting room offers a quieter place to retreat. The living flows out to a covered outdoor room with a Wolf barbecue kitchen and an organic-shaped pool, finished in Spanish mosaics with a swim lane and a shallow play shelf for younger children.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EFive bedrooms are softened by layered, motorised curtains. Three marble-lined ensuites and a main bathroom have underfloor heating, a powder room serves guests, and a family retreat gives everyone room to spread out. Behind the finishes is everyday ease: zoned Daikin climate control, Casambi smart lighting and security, Sonos audio throughout and a 13.16kW solar system.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EDouble garaging with internal access completes the home, which sits within easy reach of The Esplanade, Georges Heights and Mosman village.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EKEY DETAILS: \u003Cbr\u002F\u003E•\\\\tNewly built by EMK Architects and Hammercorp, designed around curved, organic forms\u003Cbr\u002F\u003E•\\\\tViews toward Balmoral Beach and Middle Harbour, with a layout planned to capture northeast light\u003Cbr\u002F\u003E•\\\\t545sqm block with 407sqm total floor area across two levels\u003Cbr\u002F\u003E•\\\\tFour-metre living ceiling, sculptural staircase and circular skylights carrying light through the home\u003Cbr\u002F\u003E•\\\\tFive bedrooms, Calacatta Verde marble ensuites, main bathroom and powder room, plus family retreat\u003Cbr\u002F\u003E•\\\\tCalacatta Monet marble kitchen with V-Zug and Sub-Zero appliances and a hidden butler's pantry\u003Cbr\u002F\u003E•\\\\tMosaic-tiled pool with swim lane and children's play shelf, beside a covered Wolf outdoor kitchen\u003Cbr\u002F\u003E•\\\\tCasambi smart home, Occhio lighting, Sonos audio and 13.16kW solar for lower running costs\u003Cbr\u002F\u003E•\\\\tDouble garage with secure internal access\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EA newly completed architectural home on the Balmoral Slopes, designed for families who want light, outlook and resort-style ease every day.\u003Cbr\u002F\u003E\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fbe06973eedca9a6879c2fc4a050765506748f33031f8242d89fc0d9492250248\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"images\\\":[{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fbe06973eedca9a6879c2fc4a050765506748f33031f8242d89fc0d9492250248\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fa31c3c68cdcff3b5cb02d7796a4cc57b21f88d32a9e81c136b4dfffe21653040\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F44d82fd8ff346f94146124e687cf8bf76234fce4726242886b2f8e45dae83f59\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F69d7f474abf5286377a107c044d26f5eac0aed0f235dc0ad6a611e14a743c4d7\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fa680200a528edc23cb5760f27301ae17e64d23e4789cf8402a00fdf26137cc1b\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F1dcd33052987d0c6f87e5497866d1e421bc34479ff2db31ad28165082d3fd9f0\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F655a19172f886889a3b2dcef76d26a0d5d8785695eedf0ee2aed39a1ae2a1ab6\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F5586fd4fdea74e19d1addadc33820433 eparate TV room is warmed by a Heat n Glo fireplace and opens out to the great outdoors. Entertain indoors or outdoors, Travertine paving creates year-round alfresco living spaces.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EPresenting four inviting bedrooms, the sophisticated master suite comprises of a walk-in robe and luxe ensuite with walk-in shower and double vanity. Both bathrooms are finished in premium heated tiles with subtle marble veining; the primary bathroom boasts a family friendly bathtub. Impressive in every way, other features of appeal include custom joinery, chic storage options, ducted and split system air conditioning plus a locked temperature controlled wine cellar with capacity for up to 1500 bottles. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EA DA approval is in place for a second-storey extension, incorporating two bedrooms, a bathroom, dedicated study and generous family living space, providing an exceptional opportunity to enhance the home's accommodation, functionality and long-term appeal.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ELocated above Reid Park and within easy reach of the scenic Cremorne Point Walk, stroll around the waterfront at your leisure to either Mosman Bay or Cremorne Point. Close to local cafes and speciality retail stores, Spofforth Street shops are less than 200 metres away with the attractions of Cremorne Junction and Military Road just a little further up the road. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003E•\\\\tWide oak floorboards in the hallway and living\u003Cbr\u002F\u003E•\\\\tEntertainer's island bench in renovated kitchen\u003Cbr\u002F\u003E•\\\\tStone benchtops and splashback, Miele dishwasher\u003Cbr\u002F\u003E•\\\\tIlve wall and combi ovens and inset gas cooktop\u003Cbr\u002F\u003E•\\\\tConcealed French door Fisher & Paykel fridge\u003Cbr\u002F\u003E•\\\\tDA approval for 2nd storey extension\u003Cbr\u002F\u003E•\\\\tBi-fold doors open to north facing outdoor living\u003Cbr\u002F\u003E•\\\\tTV room connects to lands bd58c37b511a73c99bd8018cbef4b7cd9174\u002Fmain.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"_links\\\":{\\\"canonical\\\":{\\\"href\\\":\\\"https:\u002F\u002Fwww.realestate.com.au\u002Fagent\u002Fgeoff-allan-1752530?cid={cid}\\\",\\\"__typename\\\":\\\"AbsoluteLinks\\\"},\\\"__typename\\\":\\\"ListerLinks\\\"},\\\"showInMediaViewer\\\":false,\\\"__typename\\\":\\\"Lister\\\"}]},\\\"__typename\\\":\\\"BuySearchResultsItem\\\"},{\\\"listing\\\":{\\\"__typename\\\":\\\"BuyResidentialListing\\\",\\\"id\\\":\\\"152538616\\\",\\\"description\\\":\\\"Combining the best of resort-style living and classic Mosman Federation architecture, this artfully renovated five-bedroom semi-detached home is enviably set within a picturesque strip of character homes positioned just 240 metres from village life.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ELandscaped to create a private oasis at the rear, clever design provides for an organic shaped swimming pool, pool house with sauna and ambient alfresco dining. Maintaining a seamless connection between inside and out, a wall of bi-fold doors retracts to reveal the magnetic appeal of the great outdoors. Reinvented with much respect to the home's history, shaker joinery in the entertainer's kitchen is complemented by stone benchtops and Carrara marble splashbacks. Centred around a social island bench, the kitchen is luxuriously appointed with Miele appliances and sits next to the family-friendly dining space personalised by chic wallpaper and wall lighting.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EStemming off a traditional hallway grounded by dark timber floorboards, the living rooms are both welcoming and sophisticated. Anchored by a striking carved marble fireplace with a coal-effect gas fire in the lounge room for cosy winter nights, the living room has been tastefully modernised with a wall of bespoke joinery and timeless plantation shutters. Offering a selection of inviting bedrooms across two levels, the master bedroom opens through romantic French doors to a private terrace overlooking the swimming pool. The master also features a renovated ensuite with a striking Perrin & Rowe pedestal vanity. The Perrin and Rowe tapware continues throughout, including in the second ensuite and primary bathroom on entry level, subway and penny round tiles add an everlasting elegance to the bathroom design. The second bedroom upstairs also features a built-in robe and ensuite.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EHoliday at home this summer and enjoy the nostalgic charm of this exceptional property. Proving location truly is everything, Military Road buses are less than 450 metres away, along with the local cafe scene, Fitness First, Mosman Swim Centre, Bridgepoint Shopping Centre and the wide-open spaces of Allan Border Oval.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E•\\\\tClassic black & white tiling on the front porch\u003Cbr\u002F\u003E•\\\\tHallway with ornate archway and timber floors\u003Cbr\u002F\u003E•\\\\tBeautiful carved marble fireplace in lounge room\u003Cbr\u002F\u003E•\\\\tLounge room joinery with a classic shaker profile\u003Cbr\u002F\u003E•\\\\tKitchen with Miele induction cooktop and oven\u003Cbr\u002F\u003E•\\\\tIntegrated Miele dishwasher, built-in fridge\u002Ffreezer\u003Cbr\u002F\u003E•\\\\tTwo pendant lights above the timber-topped island\u003Cbr\u002F\u003E•\\\\tBi-folds open off dining and kitchen to backyard\u003Cbr\u002F\u003E•\\\\tRetractable awning protects the poolside dining\u003Cbr\u002F\u003E•\\\\tMarble cobblestones surround the swimming pool\u003Cbr\u002F\u003E•\\\\tPool house with sauna, sink and concealed workshop\u003Cbr\u002F\u003E•\\\\tTraditional Finnish-style Western Red Cedar sauna with Harvia heater\u003Cbr\u002F\u003E•\\\\tCarpeted stairs leading to three upstairs bedrooms\u003Cbr\u002F\u003E•\\\\tBrand new 100% wool carpet throughout all carpeted areas\u003Cbr\u002F\u003E•\\\\tMaster with ensuite, built-in robes and terrace\u003Cbr\u002F\u003E•\\\\tEnsuite off second bedroom, skylight third bedroom\u003Cbr\u002F\u003E•\\\\tClawfoot bathtub in the stunning primary bathroom \u003Cbr\u002F\u003E•\\\\tConcealed laundry with sink and storage options\u003Cbr\u002F\u003E•\\\\tBedrooms with built-in robes, one with built-in desk\u003Cbr\u002F\u003E•\\\\tBedroom five with access to additional roof storage\u003Cbr\u002F\u003E•\\\\tCoat cupboard and practical under-stair storage\u003Cbr\u002F\u003E•\\\\tDetailed skirting boards\u002Fcornices, ceiling roses\u003Cbr\u002F\u003E•\\\\tLeadlight and stained-glass windows at front\u003Cbr\u002F\u003E•\\\\tA curated selection of wall sconces and pendants\u003Cbr\u002F\u003E•\\\\tCeiling fans, air-conditioning, intercom system\u003Cbr\u002F\u003E•\\\\t240m to Allan Border Oval and Village Green\u003Cbr\u002F\u003E•\\\\t240m to local cafes and Fourth Village Providore\u003Cbr\u002F\u003E•\\\\t500m to Bridgepoint Shops and Spit Junction\u003Cbr\u002F\u003E•\\\\t450m to B-Line buses to the city and Northern Beaches\u003Cbr\u002F\u003E•\\\\t190m to Mosman Public School \u003Cbr\u002F\u003E•\\\\t500m to Mosman High School\u003Cbr\u002F\u003E•\\\\t700m to Sacred Heart Catholic Primary School\u003Cbr\u002F\u003E•\\\\t650m to Mosman Preparatory School\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E* All information contained herein is gathered from sources we consider to be reliable, however we cannot guarantee or give any warranty to the information provided. Looking for a home loan? Contact Loan Market's Matt Clayton, our preferred broker. He doesn't work for the banks, he works for you. Call him on 0414 877 333 or visit https:\u002F\u002Fbroker.loanmarket.com.au\u002Flower-north-shore\u002F\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EFor more information or to arrange an inspection, please contact Lewis Adams 0413 572 441 or Benoit Guittonneau 0416 514 010 .\u003Cbr\u002F\u003E\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fe398c4dde42eed9d08693b9f eel Sub-Zero refrigerator sits perfectly within a sleek wall of never-ending storage.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThree bedrooms are grouped together upstairs, the master delights in the showstopping views from its idyllic filigree balcony. Opening to a hotel style ensuite, a freestanding bathtub sits underneath a chandelier. Both bathrooms and powder room benefit from underfloor heating and are cohesively stylish in their tile selection. Sure to exceed expectations, there are multiple skylights, a retractable awning over the rear courtyard, a practical walk-in laundry, a video intercom and ducted reverse cycle air-conditioning.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EEmbraced by paved courtyards and landscaped gardens with rear access from Richie Lane to single car garaging, experience absolute convenience with minimal maintenance. Positioned at the northern end of Muston Street with level access to all that Mosman has to offer, secure your own slice of this exclusive postcode.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E•\\\\tFuture proofed with an internal passenger lift\u003Cbr\u002F\u003E•\\\\tHeated Limestone flooring, stone encased fireplace\u003Cbr\u002F\u003E•\\\\tSoaring ceilings, streamlined architectural detailing\u003Cbr\u002F\u003E•\\\\tChandelier lit dining alongside translucent stairs\u003Cbr\u002F\u003E•\\\\tCustom entertainment unit in the family room\u003Cbr\u002F\u003E•\\\\tStone encased kitchen island, handleless joinery\u003Cbr\u002F\u003E•\\\\tHighland 4 burner gas and induction cooktop\u003Cbr\u002F\u003E•\\\\tTwo integrated Miele dishwashers and two sinks\u003Cbr\u002F\u003E•\\\\tAn oversized stainless-steel Sub-Zero refrigerator \u003Cbr\u002F\u003E•\\\\tSkylit upstairs with mirrored wall to enhance light\u003Cbr\u002F\u003E•\\\\tBi-fold doors open to viewing balcony off master\u003Cbr\u002F\u003E•\\\\tCarpeted bedrooms, all bedrooms with built-ins \u003Cbr\u002F\u003E•\\\\tLimestone bathrooms, two freestanding bathtubs\u003Cbr\u002F\u cony. Its two balconies and paved poolside area offer perfect place for sunset drinks and watching Sydney's famous New Years Eve fireworks. Positioned just a two-minute walk to South Mosman Wharf, this graceful home's privileged setting, serene harbour outlook and rich historical appeal, create a truly memorable offering.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E- Exquisite Arts & Crafts home with period features and fixtures\u003Cbr\u002F\u003E- Breathtaking Mosman Bay, city and Harbour Bridge views\u003Cbr\u002F\u003E- Traditional layout with formal and informal living\u002Fdining\u003Cbr\u002F\u003E- Choice of two sunlit balconies, perfect NYE vantage points\u003Cbr\u002F\u003E- Original high ornate ceilings, polished timber floorboards\u003Cbr\u002F\u003E- Sleek stone kitchen w\u002F Miele cooktop & grill, dishwasher\u003Cbr\u002F\u003E- Four well-sized bedrooms, lower opens to sunny garden & pool\u003Cbr\u002F\u003E- Upper-level master opens to sun bathed view-swept balcony \u003Cbr\u002F\u003E- Master bedroom with high raked cathedral ceiling and ensuite\u003Cbr\u002F\u003E- Charming bathrooms with chequerboard black & white floors\u003Cbr\u002F\u003E- Exquisite original working fireplaces, split air conditioning\u003Cbr\u002F\u003E- Lovely established gardens and charming private back courtyard\u003Cbr\u002F\u003E- Heated saltwater pool with gazebo & stunning views of Mosman Bay\u003Cbr\u002F\u003E- Sandstone wine cellar and vast storage, external laundry with w\u002Fc\u003Cbr\u002F\u003E- Two-min walk to the ferry wharf and bus stop\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F438441b4cef787fa3883dd83f9eaf56eaac82d6f7d234961f6b1c8f04d08ea93\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"images\\\":[{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F438441b4cef787fa3883dd83f9eaf sidential Sales\\\",\\\"photo\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fe05e977cf30f8c7de28096e5de7964a46fee73823699b4bd04465332846c806e\u002Fmain.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"_links\\\":{\\\"canonical\\\":{\\\"href\\\":\\\"https:\u002F\u002Fwww.realestate.com.au\u002Fagent\u002Fdan-meakins-3932276?cid={cid}\\\",\\\"__typename\\\":\\\"AbsoluteLinks\\\"},\\\"__typename\\\":\\\"ListerLinks\\\"},\\\"showInMediaViewer\\\":false,\\\"__typename\\\":\\\"Lister\\\"}]},\\\"__typename\\\":\\\"BuySearchResultsItem\\\"},{\\\"listing\\\":{\\\"__typename\\\":\\\"BuyResidentialListing\\\",\\\"id\\\":\\\"152044948\\\",\\\"description\\\":\\\"Entry via Punch Lane\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EDiscover this exceptional penthouse apartment, one of only four exclusive residences, offering an impressive 294sqm on title and a superb sense of privacy, space and sophistication.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EOccupying an elevated position on the Balmoral slopes with a prized north-east aspect, this flawlessly renovated split-level residence showcases premium finishes, expansive living spaces and a spectacular sun-drenched terrace capturing panoramic views across Middle Harbour, North Head and beyond.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EDesigned for effortless entertaining, the expansive terrace features an integrated BBQ and Vergola awning, creating a seamless outdoor setting from which to enjoy the breathtaking harbour outlook.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThe Caesarstone kitchen is appointed with a fully integrated fridge and Miele gas appliances, while the spacious accommodation includes a luxurious master suite with walk-in robe and ensuite with twin basins. Three of the four bedrooms, including the master, open directly to a private courtyard and feature built-in wardrobes.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EA versatile media room, home office or fourth bedroom provides additional flexibility, complemented by a built-in study nook.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EPerfectly positioned just 500m from Balmoral Beach and 550m from Mosman Village, with its shops, cafés and public transport, this is a rare opportunity to secure a sophisticated penthouse residence offering exceptional scale, privacy and spectacular panoramic harbour views.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E- Expansive entertaining terrace with integrated BBQ, Vergola awning and panoramic harbour views\u003Cbr\u002F\u003E- Premium Caesarstone kitchen with integrated fridge and Miele gas appliances\u003Cbr\u002F\u003E- Master suite with walk-in robe and ensuite with twin basins\u003Cbr\u002F\u003E- Three bedrooms opening to the private courtyard\u003Cbr\u002F\u003E- Flexible media room, home office or fourth bedroom, solid timber joinery\u003Cbr\u002F\u003E- Built-in study nook and extensive storage\u003Cbr\u002F\u003E- Air conditioning, skylight windows and alarm system\u003Cbr\u002F\u003E- Secure private entrance with video intercom\u003Cbr\u002F\u003E- Cable and internet throughout\u003Cbr\u002F\u003E- Travertine floors and internal laundry\u003Cbr\u002F\u003E- Automatic double side by side lock-up garage plus allocated visitor parking\u003Cbr\u002F\u003E- Pet-friendly boutique building\u003Cbr\u002F\u003E- 500m to Balmoral Beach, 1.3km to Chinamans Beach \u003Cbr\u002F\u003E- 270m to Bus Stop on Spit Road and 550m to Spit Junction B-line Bus Stop both with routes to CBD\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E* All information contained herein is gathered from sources we consider to be reliable, however we cannot guarantee or give any warranty to the information provided.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ELooking for a home loan? Contact Loan Market's Matt Clayton, our preferred broker. He doesn't work for the banks, he works for you. Call him on 0414 877 333 or visit https:\u002F\u002Fbroker.loanmarket.com.au\u002Flower-north-shore\u002F\u003Cbr\u002F\u003E\u003Cbr\u002F\u00 ypename\\\":\\\"Image\\\"},\\\"_links\\\":{\\\"canonical\\\":{\\\"href\\\":\\\"https:\u002F\u002Fwww.realestate.com.au\u002Fagent\u002Fsabrina-gao-3237456?cid={cid}\\\",\\\"__typename\\\":\\\"AbsoluteLinks\\\"},\\\"__typename\\\":\\\"ListerLinks\\\"},\\\"showInMediaViewer\\\":false,\\\"__typename\\\":\\\"Lister\\\"}]},\\\"__typename\\\":\\\"BuySearchResultsItem\\\"},{\\\"listing\\\":{\\\"__typename\\\":\\\"BuyResidentialListing\\\",\\\"id\\\":\\\"149783284\\\",\\\"description\\\":\\\"Tightly held by the original owner and masterfully engineered to maintain its prominence as one of Mosman’s largest and most luxurious single-level homes, this world-class residence featuring 5 bedrooms, 3 bathrooms, and 3 vehicle garaging is one of only 2 within the exclusive ‘Raglan Residences’. Offering 400sqm of whole-floor living, 441sqm on title including garaging, the landmark corner-positioned building, largely freestanding to 3 sides, presents as a triumph of heritage-inspired design and modern liveability from award-winning architects Giles Tribe, and is strategically located for convenience and lifestyle. It pays homage to the building that originally occupied the site and forms part of what is widely regarded as ‘Australia’s best-preserved Federation streetscape’, while the home spans the entire 1st floor and combines impressive house-like proportions with elevated seclusion and direct village prestige.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EConstructed of full brick including all internal walls for exceptional acoustic privacy, the residence offers private level access and secure lift entry directly into the home, creating a distinct sense of arrival, with triple level-from-the-street secure garaging and internal access. The interiors showcase refined architectural detailing throughout, including high tray ceilings, warm engineered oak floors, bespoke cabinetry, multizone ducted reverse-cycle air-conditioning, underfloor heating in all bathrooms and a feature gas fireplace. The floorplan is lavish in scale and exceptionally well considered, introduced by a substantial entrance foyer connecting separate living and accommodation wings. Floor-to-ceiling bifold doors off the master living and dining rooms reveal a magnificent entertaining terrace screened by greenery, complete with a built-in chef’s stainless-steel barbecue. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EA 2nd lounge provides an inviting space for relaxation or a movie room and opens to a covered balcony. All bedrooms are generous with full-height built-ins, while the master bedroom wing features a walk-in robe, an opulent ensuite with standalone bath and its own private lounge room. There is also a versatile 5th bedroom\u002Fguest suite or executive office, along with an exquisitely finished main bathroom and a large Miele-equipped laundry room. As expected in a home of this calibre, the kitchen is a chef’s showpiece, brilliantly designed for entertaining with a lengthy centre island, stunning quartz stone benchtops and a full complement of premium Miele appliances including multiple ovens, a plate warmer, induction cooktop and integrated French-door refrigerator\u002Ffreezer, plus a Bosch dishwasher. Storage is abundant with soft-close joinery and a walk-in pantry, and there is also a conservatory-style 2nd dining room flowing out to the terrace.\u003Cbr\u002F\u003E \u003Cbr\u002F\u003EOther attributes include elegant wall treatments, C-Bus smart lighting and video intercom security. The residence is footsteps to Mosman village cafés, restaurants and boutiques, with buses to the CBD at the door. Key lifestyle destinations are close by: 1.4 km to Balmoral Beach and Bathers’ Pavilion, 1.4 km to Mosman Bay Wharf, Taronga Zoo, and moments to Sirius Cove, Clifton Gardens and harbourside walking trails. Families and downsizers are destined to be impressed by this one-of-a-kind property, with proximity to highly regarded schools including Mosman Public School, Sacred Heart Catholic Primary School and Queenwood School for Girls.\u003Cbr\u002F\u003E \u003Cbr\u002F\u003EAn unparalleled residence delivering the dream Mosman Village lifestyle - superior scale, privacy and luxury on a level rarely offered.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EA resident testimonial is available upon request for buyers seeking further insight into life at ‘Raglan Residences’.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EInspect:\u003Cbr\u002F\u003EBy Appointment \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EOutgoings per quarter approximately:\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EStrata:\u003Cbr\u002F\u003E$2,041\u003Cbr\u002F\u003E \u003Cbr\u002F\u003ECouncil:\u003Cbr\u002F\u003E$579\u003Cbr\u002F\u003E \u003Cbr\u002F\u003EWater:\u003Cbr\u002F\u003E$203\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EJaime Upton\u003Cbr\u002F\u003ESydney Sotheby’s International Realty\u003Cbr\u002F\u003EM: +61 414 31 21 31\u003Cbr\u002F\u003EE: jaime.upton@sydneysothebysrealty.com\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ECo-Agent:\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EBill Kondylis\u003Cbr\u002F\u003EBanks & Noble Real Estate \u003Cbr\u002F\u003EM: +61 416 777 883 \u003Cbr\u002F\u003EE: bill.k@banksnoble.com.au\u003Cbr\u002F\u003E\\\",\\\"media\\\":{\\\"mainImage\\\":{\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F4d6d3ca5ce98fb954e29597963108f0919beb69e5134c23b8143c482b87be90f\u002Fimage.jpg\\\",\\\"__typename\\\":\\\"Image\\\"},\\\"images\\\":[{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F4d6d3ca5ce98fb954e29597963108f0919beb69e5134c23b8143c482b87be90f\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002Fc688ec28cdd15b7323c742c6637c8ec6a02e8e420f0ad9a9e8b7a46ec2d1c61c\u002Fimage.jpg\\\"},{\\\"__typename\\\":\\\"Image\\\",\\\"templatedUrl\\\":\\\"https:\u002F\u002Fi2.au.reastatic.net\u002F{size}\u002F5f1dcf8691da4d298bc73

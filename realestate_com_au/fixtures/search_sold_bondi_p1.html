gance. A perfectly manicured front garden compliments the tuck-pointed brick facade that frames the stained glass lead light windows and door. The wide entrance hallway, draws you past three large bedrooms to the spacious formal lounge room with cozy gas fire, and all boast ornate patterned high ceilings and original timber floors, that express a refined sense of sophistication and character. From here the staircase leads to two more bedrooms with new wool carpet, serviced by a period bathroom. The rear of the home has a serviceable mudroom and enviable period family bathroom with tessellated tiles and clawfoot cast iron bath, then extends into two levels of stunning indoor and outdoor entertaining space, that consist of multiple light-filled dining and living areas, an entertainers' deck, a state-of-the-art kitchen and a heated plunge pool. With secure rear lane vehicle access for parking, excellent access to public transport and schools. Nestled in a tranquil pocket of Bondi, this home is centrally located, a stroll from both Bondi Beach and Westfield, while surrounded by a diverse selection of bustling cafes, adored eateries and renowned restaurants.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E- Large 322.5 sqm block, full brick with sandstone foundations and well maintained gardens\u003Cbr\u002F\u003E- Exquisite formal lounge room, gas fireplace & chandelier\u003Cbr\u002F\u003E- Light-filled open-plan kitchen, dining and living space with air con, skylights and wall to wall bifold glass doors that lead to a vibrant deck with gas bbq\u003Cbr\u002F\u003E- Poolside dining\u002Fliving room with a wet bar and outdoor Buschbeck 3 in one bbq, fire pit and wood fire pizza oven.\u003Cbr\u002F\u003E- Chef's kitchen with white and oak timber cabinetry, brushed gold taps and hardware, white ceramic  butler's sink, premium Falcon dual fuel oven, walk-in pantry, drinks station. wine fridge LED lights and Caeserstone bench tops and back splash\u003Cbr\u002F\u003E- Vast central isla

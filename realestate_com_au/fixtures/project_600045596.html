ses sophisticated living and dining spaces, enhanced by a desirable North-Easterly orientation. Entertain with ease in the new kitchen, featuring Miele appliances and stone benchtops, before unwinding on your private terrace and enjoying the calm, village atmosphere.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThe generously-sized master bedroom includes a contemporary ensuite, while a second bathroom and separate laundry offer everyday convenience. A sizeable guest bedroom completes this well-designed and comfortable home.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EProperty Features:\u003Cbr\u002F\u003E- Fully renovated 3-bedroom apartment\u003Cbr\u002F\u003E- New kitchen with modern appliances and stone benchtops\u003Cbr\u002F\u003E- Expansive private living and dining area\u003Cbr\u002F\u003E- Master bedroom flowing to renovated ensuite\u003Cbr\u002F\u003E- Air-conditioning \u003Cbr\u002F\u003E- Spacious terrace area\u003Cbr\u002F\u003E- Double lock-up garage\u003Cbr\u002F\u003E- Easy access to all community amenities and bus stop\u003Cbr\u002F\u003E- 24-hour emergency call system for peace of mind\u003Cbr\u002F\u003E\u003Cbr\u002F\u003ECommunity features:\u003Cbr\u002F\u003E- Indoor swimming pool & spa\u003Cbr\u002F\u003E- BBQ area\u003Cbr\u002F\u003E- Community centre\u003Cbr\u002F\u003E- Resident bar and dining\u003Cbr\u002F\u003E- Hair and beauty salon\u003Cbr\u002F\u003E- Community transport\u003Cbr\u002F\u003E- Undercover parking\u003Cbr\u002F\u003E- Community Manager\u003Cbr\u002F\u003E- Pet-friendly (subject to approval)\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EAbout The Manors of Mosman Retirement Village:\u003Cbr\u002F\u003ELocated close to public transport, and set within a warm and friendly village atmosphere, The Manors of Mosman provides the perfect setting to enjoy a carefree lifestyle.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EEnquire today to book a tour of The Manors of Mosman to discover all this wonderful community has to offer!\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EAbout Aveo Retirement Villages:\u003Cbr\u002F\u003EFor over 40 years, Aveo has been dedicated to delivering the best retirement living options for Australians. Whether you're looking for a low-maintenance lifestyle in a vibrant and social community or perhaps a community offering a little more support, we're here to help you find the right fit.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EPayment options available:\u003Cbr\u002F\u003EAs a Freehold unit, this property can be purchased under the traditional Deferred Management Fee contract only.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EDisclaimer: Images have been staged using virtual furniture, to show what it may look like when furnished. Furnishings are not included. You may have to pay a departure fee when you leave this village. You may have to share any capital gains received with the operator of this village.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E\u003Cbr\u002F\u003E(village-id-6)\\\",\\\"auction\\\":null,\\\"productDepth\\\":\\\"premiere\\\",\\\"introduction\\\":null,\\\"title\\\":\\\"Contemporary three-bedroom apartment in a prime village setting\\\",\\\"listers\\\":[{\\\"id\\\":\\\"3763948\\\",\\\"__typename\\\":\\\"Lister\\\"},{\\\"id\\\":\\\"3992512\\\",\\\"__typename\\\":\\\"Lister\\\"}]}],\\\"__typename\\\":\\\"ChildListings\\\"},\\\"description\\\":\\\"The Manors of Mosman Retirement Village is a welcoming community set amongst lush and manicured gardens and grounds, conveniently located in the prestigious harbourside suburb of Mosman. Less than 10 km from the Sydney CBD, close by are Bridgepoint and Cremorne Shopping Centres, Hayden Orpheum Picture Palace, and many award-winning restaurants.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EThe Manors of Mosman hosts a revitalised community centre, offering a welcoming, light-filled space to meet friends, entertain family and unwind in style. Residents can now enjoy a freshly-prepared meal made by the onsite chef in the elegant dining room, outdoor courtyard or cafe spaces, and when family and friends visit, they can book the private function room. \u003Cbr\u002F\u003E\u003Cbr\u002F\u003EEnjoy living in a spacious 1, 2 or 3 bedroom luxury home designed with all the modern conveniences and comfort in mind including open-plan living spaces, well-appointed kitchens, luxurious bathrooms with premium finishes and well-sized bedrooms with an ensuite and built in-robes. The Manors of Mosman is the perfect setting for a luxurious retirement, the ideal place to spend every day the way you choose.\u003Cbr\u002F\u003E\u003Cbr\u002F\u003EContact our friendly team today to book a discovery tour and find out if The Manors of Mosman is the right fit for you.\\\",\\\"projectTeams\\\":[{\\\"type\\\":\\\"Developer\\\",\\\"name\\\":\\\"Aveo Group\\\",\\\"__typename\\\":\\\"ProjectTeam\\\",\\\"description\\\":\\\"Aveo is Australia’s leading & most innovative provider of retirement living, with over 40 years’ experience helping older Australians find the perfect community to call home.\\\\nWe provide retirees with variety & choice & with a 90% resident satisfaction rate we're confident that Aveo's 10,000+ agree.\\\"},{\\\"type\\\":\\\"Sales team\\\",\\\"name\\\":\\\"Aveo Group\\\",\\\"__typename\\\":\\\"ProjectTeam\\\",\\\"description\\\":null}],\\\"propertyType\\\":{\\\"id\\\":\\\"project-retire\\\",\\\"display\\\":\\\"Retirement Living\\\",\\\"__typename\\\":\\\"PropertyType\\\"},\\\"displayLocation\\\":{\\\"address\\\":{\\\"suburb\\\":\\\"Mosman\\\",\\\"state\\\":\\\"NSW\\\",\\\"postcode\\\":\\\"2088\\\",\\\"display\\\":{\\\"shortAddress\\\":\\\"6 Hale Road\\\",\\\"__typename\\\":\\\"AddressDisplay\\\",\\\"fullAddress\\\":\\\"6 Hale Road, Mosman, NSW 2088\\\",\\\"geocode\\\":{\\\"latitude\\\":-33.82396061,\\\"longitude\\\":151.232905,\\\"__typename\\\":\\\"GeocodeDisplay\\\"}},\\\"__typename\\\":\\\"Address\\\"},\\\"nextAvailableOpeningHours\\\":{\\\"groupedByDay\\\":[],\\\"__typename\\\":\\\"InspectionData\\\"},\\\"__typename\\\":\\\"Di
